<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<title>__META_TITLE__</title>
<meta name="description" content="__META_DESC__">
<meta name="keywords" content="__META_KEYWORDS__">
<link rel="canonical" href="__CANONICAL__">
<meta property="og:title" content="__META_TITLE__">
<meta property="og:description" content="__META_DESC__">
<meta property="og:url" content="__CANONICAL__">
<meta property="og:type" content="website">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__META_TITLE__">
<meta name="twitter:description" content="__META_DESC__">
<meta name="twitter:image" content="https://predictvilla.com/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<script>
  window._LEAGUE_ID      = '__LEAGUE_ID__';
  window._LEAGUE_NAME    = '__LEAGUE_NAME__';
  window._LEAGUE_COUNTRY = '__LEAGUE_COUNTRY__';
</script>
</head>
<body>
<div id="header-placeholder"></div>

<main>
  <section>
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb mb-2" aria-label="breadcrumb">
        <a href="/">Home</a>
        <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin:0 4px;color:var(--text-soft)">chevron_right</span>
        <a href="/predictions.html">Predictions</a>
        <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin:0 4px;color:var(--text-soft)">chevron_right</span>
        <span id="breadcrumb-label" style="color:var(--primary)">__LEAGUE_NAME__</span>
      </nav>

      <!-- Heading -->
      <div class="flex-between mb-2" style="flex-wrap:wrap;gap:10px;align-items:center">
        <h1 class="section-title mb-0"><span id="league-logo-wrap"></span>__LEAGUE_NAME__ <span>Predictions</span></h1>
        <span class="text-soft" style="font-size:13px" id="league-country-label">__LEAGUE_COUNTRY__</span>
      </div>

      <!-- SEO Intro -->
      <p class="market-intro mb-3">Today's __LEAGUE_NAME__ predictions powered by the Predictvilla Intelligence Engine. Each tip is scored for form, value and market reliability across free and VIP tiers.</p>

      <!-- Date Tabs -->
      <div class="date-tabs mb-2">
        <button class="date-tab" onclick="setDate(this,'yesterday')">Yesterday</button>
        <button class="date-tab active" onclick="setDate(this,'today')">Today</button>
        <button class="date-tab" onclick="setDate(this,'tomorrow')">Tomorrow</button>
      </div>

      <!-- Filters -->
      <div class="flex gap-2 mb-3" style="flex-wrap:wrap;align-items:center">
        <select class="form-control" style="max-width:180px" id="market-filter" onchange="applyFilters()">
          <option value="">All Markets</option>
          <option value="1X2">1X2</option>
          <option value="Over/Under">Over/Under</option>
          <option value="BTTS">BTTS</option>
          <option value="Draw No Bet">Draw No Bet</option>
          <option value="Accumulator">Accumulator</option>
          <option value="Correct Score">Correct Score</option>
          <option value="Double Chance">Double Chance</option>
        </select>
        <select class="form-control" style="max-width:160px" id="result-filter" onchange="applyFilters()">
          <option value="">All Results</option>
          <option value="pending">Pending</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
        <input type="text" class="form-control" style="max-width:220px" id="search-input" placeholder="Search teams…" oninput="debounceSearch()">
      </div>

      <!-- Grid -->
      <div class="grid-1" id="predictions-grid"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>

    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
let currentPage = 1, currentDate = 'today', currentMarket = '', currentResult = '', searchTerm = '';
let searchTimer;

const LEAGUE_ID   = window._LEAGUE_ID;
const LEAGUE_NAME = window._LEAGUE_NAME;

document.addEventListener('DOMContentLoaded', () => {
  applyFilters();
});

function setDate(btn, date) {
  document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDate = date;
  currentPage = 1;
  applyFilters();
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = document.getElementById('search-input').value;
    currentPage = 1;
    applyFilters();
  }, 400);
}

function applyFilters() {
  currentMarket = document.getElementById('market-filter')?.value || '';
  currentResult = document.getElementById('result-filter')?.value || '';
  const params = { date: currentDate, page: currentPage, limit: 18, league_id: LEAGUE_ID };
  if (currentMarket) params.market  = currentMarket;
  if (currentResult) params.result  = currentResult;
  if (searchTerm)    params.search  = searchTerm;

  loadPredictions(params, document.getElementById('predictions-grid')).then(pg => renderPagination(pg));
}

function renderPagination(pg) {
  const el = document.getElementById('pagination');
  if (!pg || pg.totalPages <= 1) { el.innerHTML = ''; return; }
  const pages = [];
  for (let i = 1; i <= pg.totalPages; i++) {
    pages.push(`<button class="page-btn ${i === pg.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
  }
  el.innerHTML = pages.join('');
}

function goPage(p) {
  currentPage = p;
  applyFilters();
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
