<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<title>Reset Password — Predictvilla</title>
<meta name="description" content="Reset your Predictvilla account password.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>
<main>
  <section>
    <div class="container" style="max-width:440px">
      <div class="card">
        <h1 style="font-size:22px;font-weight:900;margin-bottom:4px">Reset Password</h1>
        <p class="text-soft mb-3" style="font-size:14px">Enter your new password below.</p>
        <div id="form-area">
          <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-control" id="new-pass" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special"></div>
          <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="conf-pass" placeholder="Repeat password"></div>
          <button class="btn btn-primary w-full" onclick="doReset()">Update Password</button>
        </div>
        <div id="success-msg" style="display:none" class="text-center">
          <span class="material-icons-round" style="font-size:48px;color:var(--primary);display:block;margin-bottom:12px">check_circle</span>
          <h3>Password Updated!</h3>
          <p class="text-soft mt-2" style="font-size:14px">You can now login with your new password.</p>
          <a href="/pricing.html#login" class="btn btn-primary mt-3">Go to Login</a>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) document.getElementById('form-area').innerHTML = `<div class="alert alert-error">Invalid or missing reset token. <a href="/pricing.html">Back to login</a></div>`;

async function doReset() {
  const password = document.getElementById('new-pass').value;
  const confirm = document.getElementById('conf-pass').value;
  if (!password || password.length < 8) { showToast('Password must be at least 8 characters', 'error'); return; }
  if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
  const r = await fetch('/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token,password}) });
  const data = await r.json();
  if (data.success) { document.getElementById('form-area').style.display='none'; document.getElementById('success-msg').style.display='block'; }
  else showToast(data.message,'error');
}
</script>
</body>
</html>
