<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscriptions — OL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin-sidebar"></div>
<div id="admin-topbar"></div>
<main id="admin-main">
  <div class="flex-between mb-3">
    <h1 class="admin-section-title mb-0">Subscriptions</h1>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" id="export-csv-btn"><span class="material-icons-round">download</span> Export CSV</button>
      <button class="btn btn-primary btn-sm" id="grant-vip-btn">+ Grant VIP</button>
    </div>
  </div>

  <div class="admin-stat-grid mb-3" id="sub-stats">
    <div class="admin-stat skeleton" style="height:80px"></div>
    <div class="admin-stat skeleton" style="height:80px"></div>
    <div class="admin-stat skeleton" style="height:80px"></div>
    <div class="admin-stat skeleton" style="height:80px"></div>
  </div>

  <div class="search-bar mb-2">
    <input type="text" class="form-control" style="max-width:220px" placeholder="Search email/name…" id="s-search">
    <select class="form-control" style="max-width:140px" id="s-plan">
      <option value="">All Plans</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annual">Annual</option>
    </select>
    <select class="form-control" style="max-width:130px" id="s-status">
      <option value="">All Status</option><option value="active">Active</option><option value="expired">Expired</option><option value="cancelled">Cancelled</option>
    </select>
  </div>

  <div class="data-table-wrap admin-card" style="padding:0">
    <table class="data-table">
      <thead><tr><th>User</th><th>Email</th><th>Plan</th><th>Status</th><th>Expires</th><th>Amount</th><th>Actions</th></tr></thead>
      <tbody id="subs-body"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</main>

<!-- Grant VIP Modal -->
<div class="modal-overlay" id="grant-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><h3>Grant VIP Access</h3><button class="modal-close" id="grant-close-btn"><span class="material-icons-round">close</span></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">User Email *</label><input type="email" class="form-control" id="g-email" placeholder="user@email.com"></div>
      <div class="form-group"><label class="form-label">Plan</label>
        <select class="form-control" id="g-plan"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annual">Annual</option></select>
      </div>
      <div class="form-group"><label class="form-label">Duration (days)</label><input type="number" class="form-control" id="g-days" value="30" min="1"></div>
      <div class="form-group"><label class="form-label">Notes (optional)</label><input type="text" class="form-control" id="g-notes" placeholder="e.g. Complimentary access"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="grant-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="grant-save-btn">Grant VIP</button>
    </div>
  </div>
</div>

<!-- Extend Modal -->
<div class="modal-overlay" id="extend-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header"><h3>Extend Subscription</h3><button class="modal-close" id="extend-close-btn"><span class="material-icons-round">close</span></button></div>
    <div class="modal-body">
      <input type="hidden" id="ext-id">
      <div class="form-group"><label class="form-label">Extra Days</label><input type="number" class="form-control" id="ext-days" value="30" min="1"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="extend-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="extend-save-btn">Extend</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
injectAdminShell('subscriptions.html');
let debTimer, currentPage = 1;

document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  loadSubs(1);

  document.getElementById('export-csv-btn').addEventListener('click', exportCsv);
  document.getElementById('grant-vip-btn').addEventListener('click', openGrant);
  document.getElementById('grant-close-btn').addEventListener('click', closeGrant);
  document.getElementById('grant-cancel-btn').addEventListener('click', closeGrant);
  document.getElementById('grant-save-btn').addEventListener('click', grantVip);
  document.getElementById('extend-close-btn').addEventListener('click', closeExtend);
  document.getElementById('extend-cancel-btn').addEventListener('click', closeExtend);
  document.getElementById('extend-save-btn').addEventListener('click', doExtend);

  document.getElementById('s-search').addEventListener('input', () => { clearTimeout(debTimer); debTimer = setTimeout(() => loadSubs(1), 400); });
  document.getElementById('s-plan').addEventListener('change', () => loadSubs(1));
  document.getElementById('s-status').addEventListener('change', () => loadSubs(1));
});

async function loadStats() {
  const d = await api('/admin/dashboard');
  const s = d.data || {};
  document.getElementById('sub-stats').innerHTML = [
    { icon:'workspace_premium', val:s.vip_users||0, label:'Active VIPs' },
    { icon:'today', val:s.new_subs_month||0, label:'New This Month' },
    { icon:'payments', val:'₦'+(s.revenue_month||0).toLocaleString(), label:'Revenue This Month' },
    { icon:'trending_down', val:(s.churn_rate||0)+'%', label:'Churn Rate' },
  ].map(i=>`<div class="admin-stat"><div style="font-size:20px"><span class="material-icons-round" style="font-size:20px">${i.icon}</span></div><div class="sv">${i.val}</div><div class="sl">${i.label}</div></div>`).join('');
}

async function loadSubs(page = 1) {
  currentPage = page;
  const search = document.getElementById('s-search').value;
  const plan = document.getElementById('s-plan').value;
  const status = document.getElementById('s-status').value;
  const params = new URLSearchParams({ page, limit: 20, ...(search&&{search}), ...(plan&&{plan}), ...(status&&{status}) });
  const d = await api(`/subscriptions/admin?${params}`);
  const subs = d.data?.subscriptions || [];
  document.getElementById('subs-body').innerHTML = subs.length
    ? subs.map(s => `<tr>
        <td>${escHtml(s.name)}</td>
        <td>${escHtml(s.email)}</td>
        <td><span class="badge badge-vip">${s.plan}</span></td>
        <td><span class="badge badge-${s.status==='active'?'active':s.status==='expired'?'inactive':'cancelled'}">${s.status}</span></td>
        <td>${fmtDate(s.expires_at)}</td>
        <td>₦${parseFloat(s.amount||0).toLocaleString()}</td>
        <td>
          <div class="flex gap-2">
            <button class="btn btn-sm btn-ghost" data-extend-id="${s.id}">+ Extend</button>
            <button class="btn btn-sm btn-ghost" data-notify-id="${s.id}"><span class="material-icons-round">email</span></button>
            <button class="btn btn-sm btn-danger" data-cancel-id="${s.id}">Cancel</button>
          </div>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty-cell">No subscriptions found</td></tr>';

  document.querySelectorAll('[data-extend-id]').forEach(btn => btn.addEventListener('click', () => openExtend(btn.dataset.extendId)));
  document.querySelectorAll('[data-notify-id]').forEach(btn => btn.addEventListener('click', () => notifyUser(btn.dataset.notifyId)));
  document.querySelectorAll('[data-cancel-id]').forEach(btn => btn.addEventListener('click', () => cancelSub(btn.dataset.cancelId)));

  renderPager(document.getElementById('pager'), page, d.data?.total||0, 20, 'loadSubs');
}

function openGrant() { document.getElementById('grant-modal').classList.add('open'); }
function closeGrant() { document.getElementById('grant-modal').classList.remove('open'); }

async function grantVip() {
  const body = { email: document.getElementById('g-email').value.trim(), plan: document.getElementById('g-plan').value, days: parseInt(document.getElementById('g-days').value), notes: document.getElementById('g-notes').value };
  if (!body.email) { showToast('Email required','error'); return; }
  const users = await api(`/admin/users?limit=1&search=${encodeURIComponent(body.email)}`);
  const user = users.data?.users?.find(u => u.email.toLowerCase() === body.email.toLowerCase());
  if (!user) return showToast('No user found with that email', 'error');
  const d = await api('/subscriptions/admin/grant', {method:'POST', body:JSON.stringify({user_id:user.id, plan:body.plan, days:body.days})});
  if (d.success) { closeGrant(); showToast('VIP granted!','success'); loadSubs(currentPage); }
  else showToast(d.message,'error');
}

function openExtend(id) { document.getElementById('ext-id').value = id; document.getElementById('extend-modal').classList.add('open'); }
function closeExtend() { document.getElementById('extend-modal').classList.remove('open'); }

async function doExtend() {
  const id = document.getElementById('ext-id').value;
  const days = parseInt(document.getElementById('ext-days').value);
  const d = await api(`/subscriptions/admin/${id}/extend`, {method:'PUT', body:JSON.stringify({days})});
  if (d.success) { closeExtend(); showToast('Extended!','success'); loadSubs(currentPage); }
  else showToast(d.message,'error');
}

async function cancelSub(id) {
  if (!confirm('Cancel this subscription?')) return;
  const d = await api(`/subscriptions/admin/${id}/cancel`, {method:'PUT'});
  if (d.success) { showToast('Cancelled','info'); loadSubs(currentPage); }
  else showToast(d.message,'error');
}

async function notifyUser(id) {
  const d = await api(`/subscriptions/admin/${id}/notify-expiry`, {method:'POST'});
  if (d.success) showToast('Notification sent','success');
  else showToast(d.message,'error');
}

async function exportCsv() {
  const r = await fetch('/api/subscriptions/admin/export', {credentials:'include'});
  const blob = await r.blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'subscriptions.csv'; a.click();
}
</script>
</body>
</html>
