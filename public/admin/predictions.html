<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predictions — OL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin-sidebar"></div>
<div id="admin-topbar"></div>
<main id="admin-main">
  <div class="flex-between mb-3">
    <h1 class="admin-section-title mb-0">Predictions</h1>
    <div class="flex gap-2">
      <button type="button" class="btn btn-ghost" id="autofill-all-odds-btn"><span class="material-icons-round">currency_exchange</span> Autofill Live Odds</button>
      <button class="btn btn-primary" id="add-pred-btn">+ Add Prediction</button>
    </div>
  </div>

  <!-- View tabs -->
  <div class="tab-row mb-3" id="admin-view-tabs" style="gap:6px;border-bottom:1px solid var(--border);padding-bottom:12px">
    <button class="category-tab active" data-view="upcoming" onclick="setAdminView(this,'upcoming')">
      <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin-right:4px">schedule</span>Upcoming
    </button>
    <button class="category-tab" data-view="live" onclick="setAdminView(this,'live')" style="display:inline-flex;align-items:center;gap:5px">
      <span id="live-dot" style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block"></span>Live
    </button>
    <button class="category-tab" data-view="finished" onclick="setAdminView(this,'finished')">
      <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin-right:4px">sports_score</span>Finished
      <span id="needs-result-badge" class="badge" style="background:rgba(239,68,68,0.18);color:#ef4444;font-size:10px;margin-left:4px;display:none"></span>
    </button>
    <button class="category-tab" data-view="queue" onclick="setAdminView(this,'queue')" style="display:inline-flex;align-items:center;gap:5px">
      <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin-right:2px">pending_actions</span>Queue
      <span id="queue-badge" class="badge" style="background:rgba(255,208,0,0.18);color:var(--gold,#ffd000);font-size:10px;margin-left:2px;display:none"></span>
    </button>
  </div>
  <style>
    #admin-view-tabs .category-tab[data-view="live"].active    { background:rgba(239,68,68,0.12); color:#ef4444; border-color:rgba(239,68,68,0.35); }
    #admin-view-tabs .category-tab[data-view="finished"].active { background:rgba(160,208,0,0.1); color:var(--primary); border-color:rgba(160,208,0,0.35); }
    #admin-view-tabs .category-tab[data-view="queue"].active   { background:rgba(255,208,0,0.1); color:#ffd000; border-color:rgba(255,208,0,0.35); }
    .needs-result { background: rgba(239,68,68,0.07) !important; }
    .needs-result td:first-child { border-left: 3px solid #ef4444; }
    .queue-row td:first-child { border-left: 3px solid #ffd000; }
  </style>
  <style>
    .analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .analysis-panel{background:var(--bg,rgba(0,0,0,.15));border:1px solid var(--border,rgba(255,255,255,.1));border-radius:10px;padding:14px}
    .analysis-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin-bottom:10px}
    .analysis-kv{display:grid;grid-template-columns:minmax(110px,.8fr) 1.2fr;gap:6px 10px;font-size:12px;margin-bottom:5px}
    .analysis-kv span:first-child{color:var(--text-soft)}
    .analysis-copy{white-space:pre-wrap;font-size:13px;line-height:1.65}
    .api-record{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .api-record summary{padding:9px 11px;cursor:pointer;font-size:12px;font-weight:700;background:rgba(160,208,0,.05)}
    .api-record pre{max-height:360px;overflow:auto;padding:12px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .analysis-loader{display:inline-block;width:20px;height:20px;border:2px solid rgba(160,208,0,.25);border-top-color:var(--primary);border-radius:50%;animation:analysis-spin .7s linear infinite}
    .research-table{width:100%;border-collapse:collapse;font-size:12px}.research-table th,.research-table td{padding:8px;border-bottom:1px solid var(--border);text-align:left}.research-table th{color:var(--text-soft)}
    .research-result-W{color:#16a34a;font-weight:800}.research-result-D{color:#d99a00;font-weight:800}.research-result-L{color:#ef4444;font-weight:800}
    .h2h-bar{padding:10px;border-radius:7px;background:#16a34a;color:#fff;text-align:center;font-weight:800;margin:10px 0}
    @keyframes analysis-spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){.analysis-grid{grid-template-columns:1fr}}
  </style>

  <div class="search-bar admin-card" style="margin-bottom:16px;padding:14px;flex-wrap:wrap">
    <input type="text" class="form-control" style="max-width:200px" placeholder="Search teams…" id="f-search">
    <select class="form-control" style="max-width:140px" id="f-cat">
      <option value="">All Categories</option>
      <option>Free</option><option>VIP</option><option>Banker</option>
    </select>
    <select class="form-control" style="max-width:190px" id="f-tip-filter">
      <option value="">All Tips</option>
    </select>
    <select class="form-control" style="max-width:130px" id="f-pub">
      <option value="">All</option><option value="1">Published</option><option value="0">Draft</option>
    </select>
    <input type="date" class="form-control" style="max-width:160px" id="f-date">
    <input type="time" class="form-control" style="max-width:130px" id="f-time-from" aria-label="Kickoff time from" title="Kickoff from">
    <input type="time" class="form-control" style="max-width:130px" id="f-time-to" aria-label="Kickoff time to" title="Kickoff to">
  </div>

  <div class="data-table-wrap admin-card" style="padding:0">
    <table class="data-table">
      <thead><tr><th><input type="checkbox" id="chk-all"></th><th>Match</th><th>Tip</th><th>Cat</th><th>Market</th><th>Odds</th><th>Conf</th><th>Date</th><th>Result</th><th>Pub</th><th>Actions</th></tr></thead>
      <tbody id="preds-body"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>

  <div class="flex gap-2 mt-2" id="bulk-bar" style="display:none!important">
    <button class="btn btn-ghost btn-sm" id="bulk-pub-btn"><span class="material-icons-round">check_circle</span> Publish Selected</button>
    <button class="btn btn-ghost btn-sm" id="bulk-unpub-btn"><span class="material-icons-round">radio_button_unchecked</span> Unpublish</button>
    <button class="btn btn-danger btn-sm" id="bulk-del-btn"><span class="material-icons-round">delete</span> Delete</button>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="pred-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header"><h3 id="modal-title">Add Prediction</h3><button class="modal-close" id="modal-close-btn"><span class="material-icons-round">close</span></button></div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Home Team *</label><input type="text" class="form-control" id="f-home" placeholder="Arsenal"></div>
        <div class="form-group"><label class="form-label">Away Team *</label><input type="text" class="form-control" id="f-away" placeholder="Chelsea"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">League</label>
          <select class="form-control" id="f-league"><option value="">Select league</option></select>
        </div>
        <div class="form-group"><label class="form-label">Match Date *</label><input type="datetime-local" class="form-control" id="f-matchdate"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Market</label>
          <select class="form-control" id="f-market" onchange="updateTipOptions()">
            <option>1X2</option>
            <option>Over/Under</option>
            <option>BTTS</option>
            <option>Double Chance</option>
            <option>Draw No Bet</option>
            <option>First Half Result</option>
            <option>Correct Score</option>
            <option>Corners</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Tip *</label>
          <select class="form-control" id="f-tip"></select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Category</label>
          <input type="text" class="form-control" id="f-category" readonly title="Automatically aligned with the selected tip">
        </div>
        <div class="form-group"><label class="form-label">Access</label>
          <select class="form-control" id="f-access">
            <option value="free">Free</option>
            <option value="vip">VIP</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Odds</label><div class="flex gap-2"><input type="number" class="form-control" id="f-odds" step="0.01" placeholder="1.85"><button type="button" class="btn btn-ghost btn-sm" id="modal-autofill-odds-btn" title="Fetch live odds"><span class="material-icons-round">currency_exchange</span> Autofill</button></div></div>
        <div class="form-group"><label class="form-label">Confidence (1–99)</label><input type="number" class="form-control" id="f-conf" min="1" max="99" placeholder="Auto"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Bookie</label><input type="text" class="form-control" id="f-bookie" placeholder="Bet9ja"></div>
      </div>
      <div class="form-group"><label class="form-label">Analysis</label><textarea class="form-control" id="f-analysis" rows="4" placeholder="Match analysis…"></textarea></div>
      <div class="form-group">
        <label class="form-label">SEO Article Body <span style="font-weight:400;color:var(--text-soft);font-size:11px">(optional — appears below the tip on the prediction page, boosts search ranking)</span></label>
        <textarea class="form-control" id="f-seo-body" rows="6" placeholder="Write a 200–400 word article about this match, teams, or league for SEO. Supports basic HTML or plain text."></textarea>
      </div>
      <div class="flex gap-3 mt-1">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="f-publish" checked> Publish immediately</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="f-banker"> Mark as Banker</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="modal-save-btn">Save Prediction</button>
    </div>
  </div>
</div>

<!-- API + AI Analysis Modal -->
<div class="modal-overlay" id="analysis-modal">
  <div class="modal" style="max-width:980px">
    <div class="modal-header">
      <h3 id="analysis-modal-title">Match Analysis</h3>
      <button type="button" class="modal-close" id="analysis-close-btn"><span class="material-icons-round">close</span></button>
    </div>
    <div class="modal-body" id="analysis-modal-body">
      <div class="empty-cell">Loading match intelligence…</div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-ghost" id="analysis-done-btn">Close</button><button type="button" class="btn btn-primary" id="analysis-apply-btn"><span class="material-icons-round">auto_awesome</span> Apply Suggestion to Edit Form</button></div>
  </div>
</div>

<!-- Set Result Modal -->
<div class="modal-overlay" id="result-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header"><h3>Set Result</h3>
      <button class="modal-close" id="result-close-btn">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="result-id">
      <div class="form-group"><label class="form-label">Home Score</label><input type="number" class="form-control" id="r-home" min="0"></div>
      <div class="form-group"><label class="form-label">Away Score</label><input type="number" class="form-control" id="r-away" min="0"></div>
      <div class="form-group"><label class="form-label">Override Result</label>
        <select class="form-control" id="r-result"><option value="">Auto-grade</option><option value="won">Won</option><option value="lost">Lost</option><option value="void">Void</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="result-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="result-save-btn">Save Result</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
injectAdminShell('predictions.html');
let currentPage = 1, totalPreds = 0, debTimer, currentView = 'upcoming', currentAnalysisPrediction = null;

function setAdminView(btn, view) {
  document.querySelectorAll('#admin-view-tabs .category-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentView = view;
  loadPreds(1);
}

// Tip options per market
const MARKET_TIPS = {
  '1X2':          ['Home Win','Draw','Away Win'],
  'Over/Under':   ['Over 1.5 Goals','Over 2.5 Goals','Over 3.5 Goals','Over 4.5 Goals','Under 1.5 Goals','Under 2.5 Goals','Under 3.5 Goals','Under 4.5 Goals'],
  'BTTS':         ['BTTS Yes','BTTS No'],
  'Double Chance':['Double Chance 1X','Double Chance X2','Double Chance 12'],
  'Draw No Bet':  ['Draw No Bet Home','Draw No Bet Away'],
  'First Half Result':['First Half Home Win','First Half Draw','First Half Away Win'],
  'Correct Score':['Score 1-0','Score 0-1','Score 1-1','Score 2-0','Score 0-2','Score 2-1','Score 1-2','Score 2-2','Score 3-0','Score 0-3','Score 3-1','Score 1-3','Score 3-2','Score 2-3','Score 0-0'],
  'Corners':      ['Over 7.5 Corners','Over 8.5 Corners','Over 9.5 Corners','Over 10.5 Corners','Over 11.5 Corners','Under 7.5 Corners','Under 8.5 Corners','Under 9.5 Corners','Under 10.5 Corners','Under 11.5 Corners'],
};

function updateTipOptions(currentTip = '') {
  const market = document.getElementById('f-market').value;
  const tips = MARKET_TIPS[market] || [];
  const sel = document.getElementById('f-tip');
  sel.innerHTML = tips.map(t => `<option value="${t}" ${t === currentTip ? 'selected' : ''}>${t}</option>`).join('');
  updateMarketCategory();
}

function marketForTip(tip) {
  return Object.keys(MARKET_TIPS).find(market => MARKET_TIPS[market].includes(tip)) || '1X2';
}
function categoryForTip(tip) {
  const special = {
    'Home Win':'home_win','Away Win':'away_win','Draw':'draw','BTTS Yes':'gg','BTTS No':'ng',
    'Double Chance 1X':'dc_1x','Double Chance X2':'dc_x2','Double Chance 12':'dc_12',
    'Draw No Bet Home':'dnb_home','Draw No Bet Away':'dnb_away',
    'First Half Home Win':'first_half_home','First Half Draw':'first_half_draw','First Half Away Win':'first_half_away',
  };
  return special[tip] || tip.toLowerCase().replace(/goals|corners|score/g, '').trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}
function updateMarketCategory() {
  const category = document.getElementById('f-category');
  if (category) category.value = categoryForTip(document.getElementById('f-tip').value || '');
}

document.addEventListener('DOMContentLoaded', () => {
  loadLeagues();
  loadPreds(1);
  updateTipOptions();

  const tipFilter = document.getElementById('f-tip-filter');
  [...new Set(Object.values(MARKET_TIPS).flat())].forEach(tip => tipFilter.appendChild(new Option(tip, tip)));

  document.getElementById('add-pred-btn').addEventListener('click', () => openModal());
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', savePred);
  document.getElementById('f-tip').addEventListener('change', updateMarketCategory);
  document.getElementById('modal-autofill-odds-btn').addEventListener('click', () => autofillOdds(document.getElementById('edit-id').value, document.getElementById('modal-autofill-odds-btn'), true));
  document.getElementById('autofill-all-odds-btn').addEventListener('click', autofillAllOdds);
  document.getElementById('result-close-btn').addEventListener('click', () => document.getElementById('result-modal').classList.remove('open'));
  document.getElementById('result-cancel-btn').addEventListener('click', () => document.getElementById('result-modal').classList.remove('open'));
  document.getElementById('result-save-btn').addEventListener('click', submitResult);
  document.getElementById('analysis-close-btn').addEventListener('click', closeAnalysis);
  document.getElementById('analysis-done-btn').addEventListener('click', closeAnalysis);
  document.getElementById('analysis-apply-btn').addEventListener('click', () => {
    if (!currentAnalysisPrediction) return;
    closeAnalysis();
    openModal(currentAnalysisPrediction);
  });
  document.getElementById('chk-all').addEventListener('change', e => toggleAll(e.target));
  document.getElementById('bulk-pub-btn').addEventListener('click', () => bulkPublish(1));
  document.getElementById('bulk-unpub-btn').addEventListener('click', () => bulkPublish(0));
  document.getElementById('bulk-del-btn').addEventListener('click', bulkDelete);

  document.getElementById('f-search').addEventListener('input', () => { clearTimeout(debTimer); debTimer = setTimeout(() => loadPreds(1), 400); });
  document.getElementById('f-cat').addEventListener('change', () => loadPreds(1));
  document.getElementById('f-tip-filter').addEventListener('change', () => loadPreds(1));
  document.getElementById('f-pub').addEventListener('change', () => loadPreds(1));
  document.getElementById('f-date').addEventListener('change', () => loadPreds(1));
  document.getElementById('f-time-from').addEventListener('change', () => loadPreds(1));
  document.getElementById('f-time-to').addEventListener('change', () => loadPreds(1));
});

async function loadLeagues() {
  const d = await api('/leagues/admin?limit=2000');
  const all = d.data?.leagues || [];
  const sel = document.getElementById('f-league');
  sel.innerHTML = '<option value="">Select competition</option>';
  all.forEach(l => sel.appendChild(new Option(l.name, l.id)));
}

function isPast(dateStr) {
  return dateStr && new Date(dateStr) < new Date();
}

function fmtKickoff(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  const date = d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
  const time = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  return `${date} <span style="color:var(--primary);font-weight:700">${time}</span>`;
}

async function loadPreds(page = 1) {
  currentPage = page;
  const search = document.getElementById('f-search').value;
  const cat = document.getElementById('f-cat').value;
  const pub = document.getElementById('f-pub').value;
  const tip = document.getElementById('f-tip-filter').value;
  const date = document.getElementById('f-date').value;
  const timeFrom = document.getElementById('f-time-from').value;
  const timeTo = document.getElementById('f-time-to').value;

  const isQueue = currentView === 'queue';
  const params = new URLSearchParams({
    page, limit: 30, admin_view: 1,
    ...(isQueue ? { is_published: '0' } : { view: currentView }),
    ...(search && { search }),
    ...(cat && { category: cat }),
    ...(tip && { tip }),
    ...(!isQueue && pub !== '' && { is_published: pub }),
    ...(date && { date }),
    ...(timeFrom && { time_from: timeFrom }),
    ...(timeTo && { time_to: timeTo }),
  });
  const d = await api(`/predictions?${params}`);
  const preds = d.data?.predictions || [];
  totalPreds = d.data?.pagination?.total || 0;

  // Show badge for finished predictions missing results
  if (currentView === 'finished') {
    const needsCount = preds.filter(p => !p.result || p.result === 'pending').length;
    const badge = document.getElementById('needs-result-badge');
    if (badge) { badge.textContent = needsCount + ' need result'; badge.style.display = needsCount ? '' : 'none'; }
  }
  // Queue badge
  if (isQueue) {
    const qb = document.getElementById('queue-badge');
    if (qb) { qb.textContent = totalPreds; qb.style.display = totalPreds ? '' : 'none'; }
  }

  const tbody = document.getElementById('preds-body');

  tbody.innerHTML = preds.length ? preds.map(p => {
    const past = isPast(p.match_date);
    const needsResult = currentView === 'finished' && (!p.result || p.result === 'pending') && p.home_score == null;
    const isQueueRow = isQueue;
    const rowClass = needsResult ? 'needs-result' : (isQueueRow ? 'queue-row' : '');
    const needsTag = needsResult ? '<span style="font-size:10px;color:#ef4444;font-weight:700;margin-left:4px">⚠ NEEDS RESULT</span>' : '';
    return `
    <tr class="${rowClass}">
      <td><input type="checkbox" class="row-chk" value="${p.id}"></td>
      <td>
        <strong>${escHtml(p.home_team)}</strong> vs <strong>${escHtml(p.away_team)}</strong>${needsTag}
        <br><span class="text-muted" style="font-size:11px">${escHtml(p.league_name||'')}</span>
      </td>
      <td style="font-weight:600;color:var(--primary)">${escHtml(p.tip||'TBD')}</td>
      <td><span class="badge" style="font-size:10px">${escHtml(p.category||'—')}</span></td>
      <td style="font-size:11px">${escHtml(p.market||'—')}</td>
      <td style="font-weight:600">${p.odds ? parseFloat(p.odds).toFixed(2) : '<span style="color:var(--text-soft)">—</span>'}</td>
      <td>${p.confidence_score ? `<span style="color:${p.confidence_score>=80?'var(--primary)':p.confidence_score>=65?'var(--warning)':'var(--danger)'}">${p.confidence_score}%</span>` : '—'}</td>
      <td style="font-size:12px">${fmtKickoff(p.match_date)}</td>
      <td><span class="badge badge-${p.result||'pending'}" style="font-size:10px">${(p.result||'PEND').toUpperCase()}${p.home_score!=null?` ${p.home_score}-${p.away_score}`:''}</span></td>
      <td>
        <button class="btn btn-sm ${p.published_at?'btn-primary':'btn-ghost'}" data-pub-id="${p.id}" data-pub-cur="${p.published_at?1:0}" ${past&&!p.published_at?'title="Match already started — publish disabled" style="opacity:0.4;cursor:not-allowed"':''}>
          <span class="material-icons-round" style="font-size:16px">${p.published_at?'check_circle':'radio_button_unchecked'}</span>
        </button>
      </td>
      <td>
        <div class="flex gap-1">
          <button class="btn btn-sm btn-ghost" data-analysis-id="${p.id}" title="View API and AI analysis"><span class="material-icons-round">analytics</span></button>
          <button class="btn btn-sm btn-ghost" data-odds-id="${p.id}" title="Autofill live odds"><span class="material-icons-round">currency_exchange</span></button>
          <button class="btn btn-sm btn-ghost" data-edit-id="${p.id}" title="Edit"><span class="material-icons-round">edit</span></button>
          <button class="btn btn-sm btn-ghost" data-result-id="${p.id}" title="Set Result"><span class="material-icons-round">flag</span></button>
          <button class="btn btn-sm btn-danger" data-del-id="${p.id}" title="Delete"><span class="material-icons-round">delete</span></button>
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="11" class="empty-cell">No predictions found</td></tr>`;

  document.querySelectorAll('[data-pub-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const past = btn.style.opacity === '0.4';
      if (past && parseInt(btn.dataset.pubCur) === 0) { showToast('Cannot publish — match has already started', 'error'); return; }
      togglePub(btn.dataset.pubId, parseInt(btn.dataset.pubCur));
    });
  });
  document.querySelectorAll('[data-edit-id]').forEach(btn => btn.addEventListener('click', () => editPred(btn.dataset.editId)));
  document.querySelectorAll('[data-analysis-id]').forEach(btn => btn.addEventListener('click', () => openAnalysis(btn.dataset.analysisId)));
  document.querySelectorAll('[data-odds-id]').forEach(btn => btn.addEventListener('click', () => autofillOdds(btn.dataset.oddsId, btn)));
  document.querySelectorAll('[data-result-id]').forEach(btn => btn.addEventListener('click', () => openResult(btn.dataset.resultId)));
  document.querySelectorAll('[data-del-id]').forEach(btn => btn.addEventListener('click', () => deletePred(btn.dataset.delId)));

  renderPager(document.getElementById('pager'), page, totalPreds, 30, 'loadPreds');
}

function openModal(p = null) {
  document.getElementById('pred-modal').classList.add('open');
  document.getElementById('modal-title').textContent = p ? 'Edit Prediction' : 'Add Prediction';
  document.getElementById('edit-id').value = p?.id || '';
  document.getElementById('f-home').value = p?.home_team || '';
  document.getElementById('f-away').value = p?.away_team || '';
  document.getElementById('f-odds').value = p?.odds || '';
  document.getElementById('f-conf').value = p?.confidence_score || '';
  document.getElementById('f-bookie').value = p?.bookie || '';
  document.getElementById('f-analysis').value = p?.analysis || '';
  const alignedMarket = p?.tip ? marketForTip(p.tip) : (p?.market || '1X2');
  document.getElementById('f-market').value = alignedMarket;
  document.getElementById('f-access').value = p?.is_vip ? 'vip' : 'free';
  document.getElementById('f-matchdate').value = p?.match_date ? p.match_date.slice(0,16) : '';
  document.getElementById('f-league').value = p?.league_id || '';
  // For new predictions: always pre-check "publish immediately"
  document.getElementById('f-publish').checked = p ? !!p.published_at : true;
  document.getElementById('f-banker').checked = !!p?.is_banker;
  document.getElementById('f-seo-body').value = p?.seo_body || '';
  // Populate tip dropdown based on selected market
  updateTipOptions(p?.tip || '');
  document.getElementById('modal-autofill-odds-btn').disabled = !p?.id;

  if (p && isPast(p.match_date)) {
    showToast('Warning: this match has already kicked off', 'error');
  }
}
function closeModal() { document.getElementById('pred-modal').classList.remove('open'); }

async function editPred(id) {
  const d = await api(`/predictions/admin/${id}`);
  const leagueId = d.data?.prediction?.league_id;
  if (leagueId && !document.querySelector(`#f-league option[value="${leagueId}"]`)) {
    const league = await api(`/leagues/${leagueId}`);
    if (league.data?.league) document.getElementById('f-league').appendChild(new Option(league.data.league.name, leagueId));
  }
  openModal(d.data?.prediction);
}

function closeAnalysis() { document.getElementById('analysis-modal').classList.remove('open'); }
function analysisValue(value) {
  if (value === null || value === undefined || value === '') return '<span class="text-soft">Not available</span>';
  if (typeof value === 'object') return escHtml(JSON.stringify(value));
  return escHtml(value);
}
function analysisRows(entries) {
  return entries.map(([label, value]) => `<div class="analysis-kv"><span>${escHtml(label)}</span><span>${analysisValue(value)}</span></div>`).join('');
}
function recentResearchTable(matches) {
  if (!matches?.length) return '<div class="text-soft" style="padding:12px">No recent matches stored.</div>';
  return `<table class="research-table"><thead><tr><th>Date</th><th>Match</th><th>Score</th><th>Result</th></tr></thead><tbody>${matches.map(match => `<tr><td>${fmtDate(match.match_date)}</td><td>${escHtml(match.home_team)} vs ${escHtml(match.away_team)}</td><td><strong>${match.home_score ?? '—'}-${match.away_score ?? '—'}</strong></td><td class="research-result-${match.result}">${match.result}</td></tr>`).join('')}</tbody></table>`;
}

async function openAnalysis(id) {
  const modal = document.getElementById('analysis-modal');
  const body = document.getElementById('analysis-modal-body');
  modal.classList.add('open');
  body.innerHTML = '<div class="empty-cell"><span class="analysis-loader"></span><br>Loading stored API and AI analysis…</div>';
  const response = await api(`/predictions/admin/${id}/analysis`);
  if (!response.success) {
    body.innerHTML = `<div class="empty-cell" style="color:var(--danger)">${escHtml(response.message || 'Could not load analysis')}</div>`;
    return;
  }
  const data = response.data || {};
  const p = data.prediction || {};
  currentAnalysisPrediction = p;
  const engine = data.engine || {};
  const records = data.apiRecords || [];
  document.getElementById('analysis-modal-title').textContent = `${p.home_team || ''} vs ${p.away_team || ''}`;
  body.innerHTML = `
    <div class="analysis-grid">
      <section class="analysis-panel"><h4>${escHtml(p.home_team || 'Home')} — Last 5</h4>${recentResearchTable(data.homeRecent)}</section>
      <section class="analysis-panel"><h4>${escHtml(p.away_team || 'Away')} — Last 5</h4>${recentResearchTable(data.awayRecent)}</section>
      <section class="analysis-panel" style="grid-column:1/-1"><h4>Head to Head — ${escHtml(p.home_team)} vs ${escHtml(p.away_team)} <span class="text-soft">(last ${(data.h2h || []).length} meetings)</span></h4>
        <div class="h2h-bar">${escHtml(p.home_team)} ${(data.h2h || []).filter(match => match.home_team === p.home_team ? match.home_score > match.away_score : match.away_score > match.home_score).length}W · Draws ${(data.h2h || []).filter(match => match.home_score === match.away_score).length} · ${escHtml(p.away_team)} ${(data.h2h || []).filter(match => match.home_team === p.away_team ? match.home_score > match.away_score : match.away_score > match.home_score).length}W</div>
        ${recentResearchTable((data.h2h || []).map(match => ({...match,result:match.home_score > match.away_score ? 'W' : match.home_score < match.away_score ? 'L' : 'D'})))}
      </section>
      <section class="analysis-panel" style="grid-column:1/-1">
        <h4>Prediction Engine / AI Analysis</h4>
        <div class="analysis-copy">${analysisValue(engine.analysis)}</div>
      </section>
      <section class="analysis-panel"><h4>Prediction</h4>${analysisRows([
        ['Tip',engine.tip],['Market',engine.market],['Confidence',engine.confidence != null ? engine.confidence + '%' : null],
        ['Intelligence score',engine.intelligenceScore],['Odds',p.odds],['Source',p.source],['API updated',engine.generatedAt ? fmtDateTime(engine.generatedAt) : null]
      ])}</section>
      <section class="analysis-panel"><h4>Form and Availability</h4>${analysisRows([
        [p.home_team || 'Home form',engine.form?.home],[p.away_team || 'Away form',engine.form?.away],
        ['Home injuries',engine.injuries?.home],['Away injuries',engine.injuries?.away],['H2H summary',engine.h2hSummary],['Bookmakers',engine.bookies]
      ])}</section>
      <section class="analysis-panel"><h4>Goal Performance</h4>${analysisRows([
        ['Home scored average',engine.goals?.homeScored],['Home conceded average',engine.goals?.homeConceded],
        ['Away scored average',engine.goals?.awayScored],['Away conceded average',engine.goals?.awayConceded]
      ])}</section>
      <section class="analysis-panel"><h4>Match Reference</h4>${analysisRows([
        ['League',p.league_name],['Kickoff',p.match_date ? fmtDateTime(p.match_date) : null],['Fixture ID',p.api_fixture_id],
        ['Home API team ID',p.home_api_team_id],['Away API team ID',p.away_api_team_id],['Fixture status',p.fixture_status]
      ])}</section>
      <section class="analysis-panel"><h4>${escHtml(p.home_team || 'Home')} Statistics</h4>${data.homeStats ? analysisRows(Object.entries(data.homeStats)) : '<span class="text-soft">No stored team statistics.</span>'}</section>
      <section class="analysis-panel"><h4>${escHtml(p.away_team || 'Away')} Statistics</h4>${data.awayStats ? analysisRows(Object.entries(data.awayStats)) : '<span class="text-soft">No stored team statistics.</span>'}</section>
      <section class="analysis-panel" style="grid-column:1/-1"><h4>Head-to-Head History</h4>
        ${(data.h2h || []).length ? analysisRows(data.h2h.map((match, index) => [`Match ${index + 1}`, `${match.home_team} ${match.home_score}-${match.away_score} ${match.away_team} (${fmtDate(match.match_date)})`])) : '<span class="text-soft">No stored head-to-head matches.</span>'}
      </section>
      <section class="analysis-panel" style="grid-column:1/-1"><h4>Archived API-Football Data (${records.length})</h4>
        ${records.length ? records.map((record, index) => `<details class="api-record"><summary>${escHtml(record.endpoint)} · ${record.updatedAt ? fmtDateTime(record.updatedAt) : 'stored record'} · #${index + 1}</summary><pre>${escHtml(JSON.stringify({ request:record.requestParams, response:record.data }, null, 2))}</pre></details>`).join('') : '<span class="text-soft">No matching archived API records are stored for this fixture yet. Run the relevant API Data Hub imports to populate this section.</span>'}
      </section>
    </div>`;
}

async function savePred() {
  const id = document.getElementById('edit-id').value;
  const matchDate = document.getElementById('f-matchdate').value;
  if (!id && matchDate && new Date(matchDate) < new Date()) {
    if (!confirm('This match date is in the past. Publish anyway?')) return;
  }
  const body = {
    home_team: document.getElementById('f-home').value.trim(),
    away_team: document.getElementById('f-away').value.trim(),
    tip: document.getElementById('f-tip').value,
    market: document.getElementById('f-market').value,
    category: categoryForTip(document.getElementById('f-tip').value),
    odds: parseFloat(document.getElementById('f-odds').value)||null,
    confidence_score: parseInt(document.getElementById('f-conf').value)||null,
    bookie: document.getElementById('f-bookie').value.trim(),
    analysis: document.getElementById('f-analysis').value.trim(),
    match_date: matchDate,
    league_id: document.getElementById('f-league').value||null,
    is_vip: document.getElementById('f-access').value === 'vip' ? 1 : 0,
    is_published: document.getElementById('f-publish').checked ? 1 : 0,
    is_banker: document.getElementById('f-banker').checked ? 1 : 0,
    seo_body: document.getElementById('f-seo-body').value.trim() || null,
  };
  if (!body.home_team || !body.away_team || !body.tip || !body.match_date) { showToast('Fill required fields','error'); return; }
  const d = id
    ? await api(`/predictions/admin/${id}`, {method:'PUT', body:JSON.stringify(body)})
    : await api('/predictions/admin', {method:'POST', body:JSON.stringify(body)});
  if (d.success) { closeModal(); showToast(id ? 'Updated!' : 'Created & published!', 'success'); loadPreds(currentPage); }
  else showToast(d.message,'error');
}

async function autofillOdds(id, btn, updateModal = false) {
  if (!id) return showToast('Save the prediction before fetching live odds.', 'error');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="analysis-loader" style="width:15px;height:15px"></span> Fetching';
  const d = await api(`/predictions/admin/${id}/autofill-odds`, { method:'POST' });
  if (d.success) {
    showToast(d.message || 'Live odds updated', 'success');
    btn.innerHTML = '<span class="material-icons-round">check_circle</span> Updated';
    if (updateModal) {
      document.getElementById('f-odds').value = d.data?.odds || '';
      document.getElementById('f-bookie').value = (d.data?.bookmakers || []).join(', ');
    } else loadPreds(currentPage);
  } else {
    btn.innerHTML = '<span class="material-icons-round">error</span> Not found';
  }
  window.setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 2500);
}

async function autofillAllOdds() {
  const btn = document.getElementById('autofill-all-odds-btn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="analysis-loader" style="width:15px;height:15px"></span> Fetching live odds…';
  const d = await api('/sync/odds', { method:'POST' });
  if (d.success) {
    showToast(d.message || 'Live odds autofill complete', 'success');
    btn.innerHTML = '<span class="material-icons-round">check_circle</span> Completed';
    loadPreds(currentPage);
  } else btn.innerHTML = '<span class="material-icons-round">error</span> Failed';
  window.setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 3000);
}

async function togglePub(id, cur) {
  const d = await api(`/predictions/admin/${id}/publish`, {method:'PUT', body:JSON.stringify({is_published: cur ? 0 : 1})});
  if (d.success) showToast(d.message || (cur ? 'Unpublished' : 'Published'), 'success');
  else showToast(d.message || 'Toggle failed', 'error');
  loadPreds(currentPage);
}

function openResult(id) {
  document.getElementById('result-id').value = id;
  document.getElementById('r-home').value = '';
  document.getElementById('r-away').value = '';
  document.getElementById('r-result').value = '';
  document.getElementById('result-modal').classList.add('open');
}

async function submitResult() {
  const id = document.getElementById('result-id').value;
  const body = { home_score: parseInt(document.getElementById('r-home').value), away_score: parseInt(document.getElementById('r-away').value), result: document.getElementById('r-result').value||undefined };
  const d = await api(`/predictions/admin/${id}/result`, {method:'PUT', body:JSON.stringify(body)});
  if (d.success) { document.getElementById('result-modal').classList.remove('open'); showToast('Result saved','success'); loadPreds(currentPage); }
  else showToast(d.message,'error');
}

async function deletePred(id) {
  if (!confirm('Delete this prediction?')) return;
  const d = await api(`/predictions/admin/${id}`, {method:'DELETE'});
  if (d.success) { showToast('Deleted','info'); loadPreds(currentPage); }
  else showToast(d.message,'error');
}

function toggleAll(chk) { document.querySelectorAll('.row-chk').forEach(c => c.checked = chk.checked); }
function getSelected() { return [...document.querySelectorAll('.row-chk:checked')].map(c=>c.value); }

async function bulkPublish(val) {
  const ids = getSelected(); if (!ids.length) { showToast('Select predictions first','error'); return; }
  await Promise.all(ids.map(id => api(`/predictions/admin/${id}/publish`, {method:'PUT', body:JSON.stringify({is_published:val})})));
  showToast('Done','success'); loadPreds(currentPage);
}
async function bulkDelete() {
  const ids = getSelected(); if (!ids.length) { showToast('Select predictions first','error'); return; }
  if (!confirm(`Delete ${ids.length} predictions?`)) return;
  await Promise.all(ids.map(id => api(`/predictions/admin/${id}`, {method:'DELETE'})));
  showToast('Deleted','info'); loadPreds(currentPage);
}
</script>
</body>
</html>
