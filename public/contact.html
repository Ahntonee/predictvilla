<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact — Predictvilla</title>
<meta name="description" content="Get in touch with the Predictvilla team. Support, feedback, and partnership enquiries.">
<link rel="canonical" href="https://predictvilla.com/contact.html">
<meta property="og:title" content="Contact — Predictvilla">
<meta property="og:description" content="Get in touch with the Predictvilla team. Support, feedback, and partnership enquiries.">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta property="og:url" content="https://predictvilla.com/contact.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact — Predictvilla">
<meta name="twitter:description" content="Get in touch with the Predictvilla team for support or partnerships.">
<meta name="twitter:image" content="https://predictvilla.com/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=KoHo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
/* Contact form pill-input overrides inside the normal card layout */
.contact-form-wrap .auth-input-wrap { margin-bottom: 12px; }
.contact-form-wrap .auth-input { font-size: 14px; }
.contact-form-wrap .auth-input.auth-select { padding-right: 46px; appearance: none; -webkit-appearance: none; cursor: pointer; }
.contact-form-wrap textarea.auth-input {
  border-radius: 18px;
  padding-top: 14px;
  padding-bottom: 14px;
  min-height: 120px;
  resize: vertical;
  line-height: 1.5;
}
.contact-form-wrap .auth-input-icon.top { top: 18px; transform: none; }
.contact-success {
  display: flex; align-items: center; gap: 10px;
  margin-top: 14px; padding: 12px 18px;
  border-radius: 50px;
  background: rgba(160,208,0,0.10);
  border: 1px solid rgba(160,208,0,0.35);
  color: var(--primary);
  font-size: 14px; font-weight: 600;
}
.contact-success .material-icons-round { font-size: 18px; }
</style>
</head>
<body>
<div id="header-placeholder"></div>
<main>
  <section>
    <div class="container" style="max-width:860px">
      <div class="grid-2" style="gap:40px;align-items:flex-start">

        <!-- Left: dynamic page content -->
        <div>
          <div id="page-content"><div class="skeleton" style="height:300px;border-radius:14px"></div></div>
          <div id="social-links" class="mt-3" style="display:none">
            <h3 style="margin-bottom:14px;font-size:15px">Find us on</h3>
            <div id="social-icons" class="flex gap-2" style="flex-wrap:wrap"></div>
          </div>
        </div>

        <!-- Right: contact form -->
        <div class="card contact-form-wrap">
          <h2 class="mb-1">Send a Message</h2>
          <p class="text-soft mb-3" style="font-size:13px">We typically respond within 24 hours.</p>

          <div class="auth-input-wrap">
            <input type="text" class="auth-input" id="c-name"
                   placeholder="Your Name"
                   autocomplete="name" maxlength="80"
                   aria-label="Your Name">
            <span class="material-icons-round auth-input-icon">person</span>
          </div>

          <div class="auth-input-wrap">
            <input type="email" class="auth-input" id="c-email"
                   placeholder="Email Address"
                   autocomplete="email" maxlength="120"
                   aria-label="Email Address">
            <span class="material-icons-round auth-input-icon">email</span>
          </div>

          <div class="auth-input-wrap">
            <select class="auth-input auth-select" id="c-subject" aria-label="Subject">
              <option value="General Enquiry">General Enquiry</option>
              <option value="VIP Subscription">VIP Subscription</option>
              <option value="Prediction Dispute">Prediction Dispute</option>
              <option value="Technical Issue">Technical Issue</option>
              <option value="Partnership / Advertising">Partnership / Advertising</option>
            </select>
            <span class="material-icons-round auth-input-icon" style="pointer-events:none">topic</span>
          </div>

          <div class="auth-input-wrap">
            <textarea class="auth-input" id="c-message"
                      placeholder="Your message…"
                      maxlength="2000"
                      aria-label="Your message"></textarea>
            <span class="material-icons-round auth-input-icon top" style="pointer-events:none">chat_bubble_outline</span>
          </div>

          <button class="auth-btn" id="contact-btn" onclick="sendContact()">
            <span class="material-icons-round">send</span> Send Message
          </button>

          <div id="form-success" class="contact-success" style="display:none">
            <span class="material-icons-round">check_circle</span>
            Message sent! We'll get back to you shortly.
          </div>
        </div>

      </div>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
const FALLBACK = `## Contact Predictvilla\n\nHave a question, spotted an issue with a prediction, or want to work with us?\n\nFill in the form and we'll get back to you within **24 hours**.\n\n### For VIP Support\nExisting VIP members can also reach us on the **Telegram channel** (link in your dashboard).\n\n### Prediction Disputes\nIf you believe a result was graded incorrectly, include the prediction slug and date in your message.`;

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('/api/pages/contact');
    const data = await r.json();
    const page = data.data?.page;
    document.getElementById('page-content').innerHTML = page
      ? `<h1 style="font-size:clamp(26px,3vw,36px);font-weight:900;margin-bottom:20px">${escapeHtml(page.title)}</h1><div class="article-content">${DOMPurify.sanitize(marked.parse(page.content||FALLBACK))}</div>`
      : `<div class="article-content">${DOMPurify.sanitize(marked.parse(FALLBACK))}</div>`;
  } catch {
    document.getElementById('page-content').innerHTML = `<div class="article-content">${DOMPurify.sanitize(marked.parse(FALLBACK))}</div>`;
  }

  // Social links
  try {
    const links = await fetchSocialLinks();
    const entries = Object.entries(links).filter(([,v]) => v);
    if (entries.length) {
      document.getElementById('social-links').style.display = 'block';
      document.getElementById('social-icons').innerHTML = entries.map(([k,v]) =>
        `<a href="${escapeHtml(v)}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="gap:6px">${k.charAt(0).toUpperCase()+k.slice(1)}</a>`
      ).join('');
    }
  } catch {}

  // Pre-fill if logged in
  const u = getUser();
  if (u) {
    if (u.name)  document.getElementById('c-name').value  = u.name;
    if (u.email) document.getElementById('c-email').value = u.email;
  }
});

async function sendContact() {
  const name    = document.getElementById('c-name').value.trim();
  const email   = document.getElementById('c-email').value.trim();
  const subject = document.getElementById('c-subject').value;
  const message = document.getElementById('c-message').value.trim();

  if (!name)    return showToast('Please enter your name', 'error');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Please enter a valid email', 'error');
  if (!message || message.length < 10) return showToast('Message is too short', 'error');

  const btn = document.getElementById('contact-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round">hourglass_top</span> Sending…';

  try {
    const r = await fetch('/api/contact', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, subject, message }),
    });
    const data = await r.json();
    if (data.success || r.status === 200) {
      document.getElementById('form-success').style.display = 'flex';
      document.getElementById('c-message').value = '';
      btn.style.display = 'none';
    } else {
      showToast(data.message || 'Failed to send. Try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons-round">send</span> Send Message';
    }
  } catch {
    showToast('Network error. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round">send</span> Send Message';
  }
}
</script>
</body>
</html>
