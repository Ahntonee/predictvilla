<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Predictions & Tips — Predictvilla</title>
<meta name="description" content="Browse today's free and VIP football predictions. Filter by league, market, or category.">
<link rel="canonical" href="https://predictvilla.com/predictions.html">
<meta property="og:title" content="Football Predictions & Tips — Predictvilla">
<meta property="og:description" content="Browse today's free and VIP football predictions. Filter by league, market, or category. 160+ leagues covered daily.">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta property="og:url" content="https://predictvilla.com/predictions.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Football Predictions & Tips — Predictvilla">
<meta name="twitter:description" content="Browse today's free and VIP football predictions across 160+ leagues.">
<meta name="twitter:image" content="https://predictvilla.com/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<main>
  <!-- Page Hero -->
  <section class="page-hero">
    <div class="container">
      <h1 class="page-hero-title">Football <span>Predictions & Picks</span></h1>
      <p class="page-hero-sub">Browse free and VIP tips across 160+ leagues — filtered by market, league, and result.</p>
    </div>
  </section>

  <!-- Top Banner Ad -->
  <section class="ad-section">
    <div class="container">
      <div class="ad-wrap ad-wrap-top" id="ad-predictions-top"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="page-with-sidebar">

        <!-- Main content -->
        <div class="page-main">
          <!-- Banker Section -->
          <div id="banker-section" class="mb-3"></div>

          <!-- View Mode Tabs -->
          <div class="tab-row mb-2" id="view-tabs" style="gap:6px">
            <button class="category-tab active" data-view="upcoming" onclick="setView(this,'upcoming')">
              <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin-right:4px">schedule</span>Upcoming
            </button>
            <button class="category-tab" data-view="live" onclick="setView(this,'live')" style="display:flex;align-items:center;gap:5px">
              <span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;animation:pulse-dot 1.2s infinite"></span>Live
            </button>
            <button class="category-tab" data-view="finished" onclick="setView(this,'finished')">
              <span class="material-icons-round" style="font-size:14px;vertical-align:middle;margin-right:4px">check_circle</span>Finished
            </button>
          </div>
          <style>
            @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
            #view-tabs .category-tab[data-view="live"].active { background:rgba(239,68,68,0.15); color:#ef4444; border-color:rgba(239,68,68,0.4); }
            #view-tabs .category-tab[data-view="finished"].active { background:rgba(160,208,0,0.12); color:var(--primary); border-color:rgba(160,208,0,0.4); }
          </style>

          <!-- Category Tabs (hidden in Live/Finished view) -->
          <div class="tab-row mb-2" id="category-tabs">
            <button class="category-tab active" data-cat="">All</button>
            <button class="category-tab" data-cat="free">Free</button>
            <button class="category-tab" data-cat="over_1_5">Over 1.5</button>
            <button class="category-tab" data-cat="over_2_5">Over 2.5</button>
            <button class="category-tab" data-cat="over_3_5">Over 3.5</button>
            <button class="category-tab" data-cat="under_2_5">Under 2.5</button>
            <button class="category-tab" data-cat="gg">BTTS</button>
            <button class="category-tab" data-cat="home_win">Home Win</button>
            <button class="category-tab" data-cat="away_win">Away Win</button>
            <button class="category-tab" data-cat="draw">Draw</button>
            <button class="category-tab" data-cat="vip">VIP</button>
          </div>

          <!-- Date Strip -->
          <div class="date-strip" id="date-strip"></div>

          <!-- Filters -->
          <div class="flex gap-2 mb-3" style="flex-wrap:wrap;align-items:center">
            <select class="form-control" style="max-width:200px" id="league-filter" onchange="applyFilters()">
              <option value="">All Leagues</option>
            </select>
            <select class="form-control" style="max-width:180px" id="market-filter" onchange="applyFilters()">
              <option value="">All Markets</option>
              <option value="1X2">1X2</option>
              <option value="Over/Under">Over/Under</option>
              <option value="BTTS">BTTS</option>
              <option value="Draw No Bet">Draw No Bet</option>
              <option value="Accumulator">Accumulator</option>
            </select>
            <select class="form-control" style="max-width:160px" id="result-filter" onchange="applyFilters()">
              <option value="">All Results</option>
              <option value="pending">Pending</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
            </select>
            <input type="text" class="form-control" style="max-width:220px" id="search-input" placeholder="Search teams…" oninput="debounceSearch()">
          </div>

          <!-- VIP Section -->
          <div id="vip-section" class="mb-3"></div>

          <!-- Grid -->
          <div class="grid-1" id="predictions-grid"></div>

          <!-- Pagination -->
          <div class="pagination" id="pagination"></div>
        </div>

        <!-- Sidebar -->
        <aside class="page-sidebar">
          <div class="ad-wrap ad-wrap-sidebar" id="ad-sidebar"></div>

          <div class="sidebar-widget" id="sponsored-posts-widget" style="display:none">
            <div class="sidebar-widget-title">Sponsored</div>
            <div id="ad-native-sidebar"></div>
          </div>

          <div class="sidebar-widget" id="sponsor-widget-2" style="display:none">
            <div class="sidebar-widget-title">Sponsored</div>
            <div id="ad-sidebar-2"></div>
          </div>
        </aside>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
let currentPage = 1, currentDate = 'today', currentCat = '', currentLeague = '', currentMarket = '', currentResult = '', searchTerm = '', currentView = 'upcoming';
let searchTimer;

function buildDateStrip() {
  const strip = document.getElementById('date-strip');
  if (!strip) return;
  const now = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = `<button class="date-strip-btn live-btn" data-date="live" onclick="setDateStrip(this,'live')">
    <span class="material-icons-round" style="font-size:14px;vertical-align:middle">radio_button_checked</span> Live
    <span class="live-count" id="live-count">0</span>
  </button>
  <div class="date-strip-sep"></div>`;

  for (let i = -1; i <= 5; i++) {
    const d = new Date(now); d.setDate(d.getDate() + i);
    let sub, dateKey;
    const dayNum = d.getDate();
    if (i === -1) { sub = 'YST'; dateKey = 'yesterday'; }
    else if (i === 0) { sub = 'TODAY'; dateKey = 'today'; }
    else if (i === 1) { sub = 'TMR'; dateKey = 'tomorrow'; }
    else {
      sub = days[d.getDay()];
      dateKey = d.toISOString().split('T')[0];
    }
    const active = (dateKey === 'today') ? ' active' : '';
    html += `<button class="date-strip-btn${active}" data-date="${dateKey}" onclick="setDateStrip(this,'${dateKey}')">
      <span class="ds-num">${dayNum}</span>
      <span class="ds-sub">${sub}</span>
    </button>`;
  }

  html += `<div class="date-strip-sep"></div>
  <button class="date-strip-cal" title="Pick date" onclick="openDatePicker()">
    <span class="material-icons-round" style="font-size:18px">calendar_month</span>
  </button>
  <input type="date" id="date-picker-input" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">`;

  strip.innerHTML = html;
  updateLiveCount();
}

async function updateLiveCount() {
  try {
    const r = await fetch('/api/predictions?date=today&limit=100');
    const data = await r.json();
    const preds = data.data?.predictions || [];
    const liveSet = new Set(['1H','2H','HT','ET','BT','P','LIVE','1H_HT','2H_ET']);
    const cnt = preds.filter(p => liveSet.has(p.fixture_status) && p.home_score !== null).length;
    const el = document.getElementById('live-count');
    if (el) el.textContent = cnt;
  } catch {}
}

function setView(btn, view) {
  document.querySelectorAll('#view-tabs .category-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentView = view;
  currentPage = 1;
  // Live/Finished: hide category tabs and date strip; Upcoming: show them
  const hideable = document.getElementById('category-tabs');
  const dateStripEl = document.getElementById('date-strip');
  if (view === 'upcoming') {
    hideable.style.display = '';
    dateStripEl.style.display = '';
  } else {
    hideable.style.display = 'none';
    dateStripEl.style.display = 'none';
    currentCat = '';
  }
  applyFilters();
}

function setDateStrip(btn, date) {
  document.querySelectorAll('.date-strip-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDate = date === 'live' ? 'today' : date;
  currentResult = date === 'live' ? 'live' : (document.getElementById('result-filter')?.value || '');
  currentPage = 1;
  applyFilters();
}

function openDatePicker() {
  const inp = document.getElementById('date-picker-input');
  if (!inp) return;
  inp.onchange = (e) => {
    const val = e.target.value; // YYYY-MM-DD
    if (!val) return;
    // Build a fake button reference and activate it
    document.querySelectorAll('.date-strip-btn').forEach(b => b.classList.remove('active'));
    currentDate = val;
    currentResult = document.getElementById('result-filter')?.value || '';
    currentPage = 1;
    applyFilters();
  };
  inp.showPicker ? inp.showPicker() : inp.click();
}

document.addEventListener('DOMContentLoaded', async () => {
  await initPage();
  buildDateStrip();
  await renderBankerCards(document.getElementById('banker-section'));
  await renderVipTeaser(document.getElementById('vip-section'));
  await populateLeagues();
  applyFilters();
  setupCategoryTabs();
  renderAds('predictions_top', document.getElementById('ad-predictions-top'));
  renderAds('sidebar', document.getElementById('ad-sidebar'));
  loadNativeSidebar();
  loadSponsorWidget2();
});

async function loadNativeSidebar() {
  const container = document.getElementById('ad-native-sidebar');
  const widget = document.getElementById('sponsored-posts-widget');
  if (!container) return;
  try {
    const r = await fetch('/api/ads/position/native_sidebar');
    const data = r.ok ? await r.json() : null;
    const ads = data?.data?.ads || [];
    if (!ads.length) return;
    widget.style.display = 'block';
    container.innerHTML = ads.map(ad => `
      <a class="sponsored-post" href="${ad.link_url||'#'}" target="_blank" rel="nofollow noopener" onclick="trackAdClick(${ad.id})">
        ${ad.image_url ? `<img src="${ad.image_url}" alt="${ad.alt_text||ad.name}" class="sponsored-post-img">` : ''}
        <div class="sponsored-post-body">
          <p class="sponsored-post-name">${ad.name}</p>
          <span class="ad-label">Sponsored</span>
        </div>
      </a>`).join('');
  } catch {}
}

async function loadSponsorWidget2() {
  const container = document.getElementById('ad-sidebar-2');
  const widget = document.getElementById('sponsor-widget-2');
  if (!container) return;
  try {
    const r = await fetch('/api/ads/position/sidebar_2');
    const data = r.ok ? await r.json() : null;
    const ads = data?.data?.ads || [];
    if (!ads.length) return;
    widget.style.display = 'block';
    container.innerHTML = ads.map(ad => `
      <a class="sponsored-post" href="${ad.link_url||'#'}" target="_blank" rel="nofollow noopener" onclick="trackAdClick(${ad.id})">
        ${ad.image_url ? `<img src="${ad.image_url}" alt="${ad.alt_text||ad.name}" class="sponsored-post-img">` : ''}
        <div class="sponsored-post-body">
          <p class="sponsored-post-name">${ad.name}</p>
          <span class="ad-label">Sponsored</span>
        </div>
      </a>`).join('');
  } catch {}
}

async function populateLeagues() {
  const leagues = await fetchLeagues();
  const sel = document.getElementById('league-filter');
  Object.entries(leagues).forEach(([continent, items]) => {
    const grp = document.createElement('optgroup');
    grp.label = continent;
    items.forEach(l => { grp.appendChild(new Option(l.name, l.id)); });
    sel.appendChild(grp);
  });
}

function setupCategoryTabs() {
  document.querySelectorAll('.category-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      currentPage = 1;
      applyFilters();
    });
  });
}

function setDate(btn, date) {
  document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDate = date;
  currentPage = 1;
  applyFilters();
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = document.getElementById('search-input').value;
    currentPage = 1;
    applyFilters();
  }, 400);
}

function applyFilters() {
  currentLeague = document.getElementById('league-filter')?.value || '';
  currentMarket = document.getElementById('market-filter')?.value || '';
  if (currentView === 'upcoming') {
    currentResult = document.getElementById('result-filter')?.value || '';
  }
  const params = { page: currentPage, limit: 18 };

  if (currentView === 'live' || currentView === 'finished') {
    params.view = currentView;
  } else {
    // upcoming: normal date + filters
    params.date = currentDate;
    if (currentCat) params.category = currentCat;
    if (currentLeague) params.league_id = currentLeague;
    if (currentMarket) params.market = currentMarket;
    if (currentResult) params.result = currentResult;
  }
  if (searchTerm) params.search = searchTerm;

  loadPredictions(params, document.getElementById('predictions-grid')).then(pg => renderPagination(pg));
}

function renderPagination(pg) {
  const el = document.getElementById('pagination');
  if (!pg || pg.totalPages <= 1) { el.innerHTML = ''; return; }
  const pages = [];
  for (let i = 1; i <= pg.totalPages; i++) {
    pages.push(`<button class="page-btn ${i === pg.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
  }
  el.innerHTML = pages.join('');
}

function goPage(p) {
  currentPage = p;
  applyFilters();
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
