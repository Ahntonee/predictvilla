<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Predictvilla's terms of service — rules and guidelines for using our football predictions and VIP tips platform.">
<link rel="canonical" href="https://predictvilla.com/terms.html">
<meta property="og:title" content="Terms of Service — Predictvilla">
<meta property="og:description" content="Terms and conditions for using the Predictvilla football predictions platform.">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div id="header-placeholder"></div>
<main>
  <section><div class="container" style="max-width:780px">
    <div id="page-content"><div class="skeleton" style="height:600px;border-radius:14px"></div></div>
  </div></section>
</main>
<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
const FALLBACK = `# Terms of Service\n\n*Last updated: January 2025*\n\n## 1. Acceptance of Terms\nBy accessing Predictvilla you agree to these Terms of Service. If you do not agree, please discontinue use immediately.\n\n## 2. Description of Service\nPredictvilla provides football match prediction information generated by statistical models. Predictions are for **entertainment and informational purposes only**.\n\n## 3. Not Financial Advice\nNothing on Predictvilla constitutes gambling, financial, or investment advice. You assume full responsibility for any betting decisions you make.\n\n## 4. VIP Membership\n- VIP subscriptions are processed via Paystack.\n- Subscriptions auto-renew unless cancelled at least 24 hours before the renewal date.\n- We offer a 7-day satisfaction guarantee for first-time subscribers.\n\n## 5. Accuracy Disclaimer\nWhile we strive for high accuracy, **no prediction service can guarantee results**. Past performance does not guarantee future results.\n\n## 6. Account Responsibilities\nYou are responsible for maintaining the security of your account credentials. You must be 18 or older to use this service.\n\n## 7. Prohibited Conduct\nYou may not scrape, resell, or redistribute our predictions without written permission.\n\n## 8. Termination\nWe reserve the right to suspend or terminate accounts that violate these terms.\n\n## 9. Changes to Terms\nWe may update these terms at any time. Continued use after changes constitutes acceptance.\n\n## 10. Contact\nFor legal queries, contact us via our Contact page.`;

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('/api/pages/terms');
    const data = await r.json();
    const page = data.data?.page;
    if (!page) throw new Error();
    document.title = `${page.title} — Predictvilla`;
    document.getElementById('page-content').innerHTML = `<div class="article-content">${DOMPurify.sanitize(marked.parse(page.content||FALLBACK))}</div>`;
  } catch {
    document.getElementById('page-content').innerHTML = `<div class="article-content">${DOMPurify.sanitize(marked.parse(FALLBACK))}</div>`;
  }
});
</script>
</body>
</html>
