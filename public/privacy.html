<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<title>Privacy Policy — Predictvilla Football Predictions</title>
<meta name="description" content="Predictvilla's privacy policy — how we collect, use, and protect your data on our football predictions platform.">
<link rel="canonical" href="https://predictvilla.com/privacy.html">
<meta property="og:title" content="Privacy Policy — Predictvilla">
<meta property="og:description" content="How Predictvilla collects, uses, and protects your personal data.">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div id="header-placeholder"></div>
<main>
  <section><div class="container" style="max-width:780px">
    <div id="page-content"><div class="skeleton" style="height:600px;border-radius:14px"></div></div>
  </div></section>
</main>
<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
const FALLBACK = `# Privacy Policy\n\n*Last updated: January 2025*\n\n## 1. Information We Collect\n- **Account data**: name, email address, country.\n- **Usage data**: pages visited, device type, referrer (anonymised).\n- **Payment data**: processed entirely by Paystack; we store only plan name and expiry date.\n\n## 2. How We Use Your Information\n- To provide and improve the Predictvilla service.\n- To send transactional emails (OTP, subscription receipts, expiry reminders).\n- To personalise your dashboard experience.\n\n## 3. Cookies\n- **ol_token** (httpOnly, Secure): authentication JWT — expires with your session or 7 days.\n- **ol_session** (SameSite=Lax): anonymous analytics session identifier.\n\n## 4. Data Sharing\nWe do not sell or share your personal data with third parties, except:\n- **Paystack**: to process payments.\n- **Email provider (SMTP)**: to send transactional emails.\n- **API-Football / The Odds API**: we send fixture IDs only, no personal data.\n\n## 5. Data Retention\nYour data is retained for as long as your account is active. You may delete your account at any time from your Dashboard → Settings.\n\n## 6. Security\nPasswords are hashed with bcrypt (cost 12). JWT tokens are stored in httpOnly cookies and never exposed to JavaScript.\n\n## 7. Your Rights\nYou may request access to, correction of, or deletion of your personal data by contacting us via the Contact page.\n\n## 8. Changes\nWe may update this policy. We will notify you by email if changes are material.\n\n## 9. Contact\nPrivacy inquiries: use the Contact page.`;

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('/api/pages/privacy');
    const data = await r.json();
    const page = data.data?.page;
    if (!page) throw new Error();
    document.title = `${page.title} — Predictvilla`;
    document.getElementById('page-content').innerHTML = `<div class="article-content">${DOMPurify.sanitize(marked.parse(page.content||FALLBACK))}</div>`;
  } catch {
    document.getElementById('page-content').innerHTML = `<div class="article-content">${DOMPurify.sanitize(marked.parse(FALLBACK))}</div>`;
  }
});
</script>
</body>
</html>
