<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<title>Sign In — Predictvilla</title>
<meta name="description" content="Sign in to your Predictvilla account for AI-powered football predictions.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=KoHo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml">
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<style>
/* Auth page is always dark — no header/footer needed */
#header-placeholder, #footer-placeholder { display: none; }
body { background: #0d1600; }
</style>
</head>
<body>
<div id="header-placeholder"></div>
<main>
<div class="auth-page">
  <div class="auth-box">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="/images/logo.png" alt="Predictvilla logo">
      <span>Predictvilla</span>
    </div>

    <!-- ── Login step ── -->
    <div id="step-login">
      <h1 class="auth-title">Login</h1>
      <p class="auth-sub">Welcome back — sign in to continue</p>

      <div class="auth-input-wrap">
        <input type="email" class="auth-input" id="login-email"
               placeholder="Email Address"
               autocomplete="email" maxlength="120"
               aria-label="Email Address">
        <span class="material-icons-round auth-input-icon">person</span>
      </div>

      <div class="auth-input-wrap">
        <input type="password" class="auth-input" id="login-pass"
               placeholder="Password"
               autocomplete="current-password" maxlength="128"
               aria-label="Password">
        <span class="material-icons-round auth-input-icon clickable"
              onclick="togglePass('login-pass', this)"
              title="Show / hide password">lock</span>
      </div>

      <div class="auth-row">
        <label class="auth-checkbox-label">
          <input type="checkbox" id="remember-me"> Remember me
        </label>
        <a class="auth-forgot" onclick="showForgot()">Forgot password?</a>
      </div>

      <div id="login-error" class="auth-error"></div>

      <button class="auth-btn" id="login-btn" onclick="doLogin()">
        <span class="material-icons-round">login</span> Login
      </button>

      <p class="auth-form-footer">
        Don't have an account? <a href="/register.html">Register</a>
      </p>
    </div>

    <!-- ── Forgot password step ── -->
    <div id="step-forgot" style="display:none">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your registered email and we'll send a reset link</p>

      <div class="auth-input-wrap">
        <input type="email" class="auth-input" id="forgot-email"
               placeholder="Email Address"
               autocomplete="email" maxlength="120"
               aria-label="Email Address">
        <span class="material-icons-round auth-input-icon">email</span>
      </div>

      <div id="forgot-error" class="auth-error"></div>
      <div id="forgot-success" class="auth-success"></div>

      <button class="auth-btn" id="forgot-btn" onclick="doForgot()">
        <span class="material-icons-round">send</span> Send Reset Link
      </button>

      <p class="auth-form-footer">
        <a onclick="showLogin()" style="cursor:pointer">
          <span class="material-icons-round" style="font-size:14px;vertical-align:middle">arrow_back</span>
          Back to login
        </a>
      </p>
    </div>

  </div>
</div>
</main>
<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
(async () => {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (r.ok) { location.href = '/dashboard.html'; }
  } catch {}
})();

function togglePass(inputId, icon) {
  const inp = document.getElementById(inputId);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  icon.textContent = show ? 'lock_open' : 'lock';
}

function setErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

function showForgot() {
  document.getElementById('step-login').style.display = 'none';
  document.getElementById('step-forgot').style.display = 'block';
  document.getElementById('forgot-email').focus();
}
function showLogin() {
  document.getElementById('step-forgot').style.display = 'none';
  document.getElementById('step-login').style.display = 'block';
}

async function doLogin() {
  setErr('login-error', '');
  const email    = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-pass').value;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('login-error', 'Please enter a valid email address.');
  if (!password) return setErr('login-error', 'Please enter your password.');

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round">hourglass_top</span> Signing in…';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!data.success) {
      setErr('login-error', data.message || 'Invalid email or password.');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons-round">login</span> Login';
      return;
    }
    if (data.data?.user) setUser(data.data.user);
    const redirect = new URLSearchParams(location.search).get('redirect') || '/dashboard.html';
    location.href = redirect;
  } catch {
    setErr('login-error', 'Network error — please check your connection.');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round">login</span> Login';
  }
}

async function doForgot() {
  setErr('forgot-error', '');
  document.getElementById('forgot-success').classList.remove('visible');
  const email = document.getElementById('forgot-email').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('forgot-error', 'Please enter a valid email address.');

  const btn = document.getElementById('forgot-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round">hourglass_top</span> Sending…';

  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();
    if (!data.success) {
      setErr('forgot-error', data.message || 'Could not send reset link. Please try again.');
    } else {
      const s = document.getElementById('forgot-success');
      s.textContent = data.message || 'Reset link sent — check your inbox.';
      s.classList.add('visible');
    }
  } catch {
    setErr('forgot-error', 'Network error — please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round">send</span> Send Reset Link';
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('step-forgot').style.display !== 'none') doForgot();
  else doLogin();
});
</script>
</body>
</html>
