<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<title>Sign In — Predictvilla</title>
<meta name="description" content="Sign in to your Predictvilla account.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 36px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.auth-logo img{width:40px;height:40px;object-fit:contain}
.auth-logo span{font-size:20px;font-weight:900;color:var(--primary);font-family:'Exo 2',sans-serif}
.auth-title{font-size:26px;font-weight:900;text-align:center;margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--text-soft);text-align:center;margin-bottom:28px}
.form-error{color:var(--danger,#ff4757);font-size:13px;margin-top:6px;display:none}
.forgot-link{font-size:13px;color:var(--text-soft);text-align:right;display:block;margin-top:-10px;margin-bottom:16px;cursor:pointer}
.forgot-link:hover{color:var(--primary)}
</style>
</head>
<body>
<div id="header-placeholder"></div>
<main>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="/images/logo.png" alt="Predictvilla">
      <span>Predictvilla</span>
    </div>

    <!-- Login form -->
    <div id="step-login">
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-sub">Welcome back — sign in to your account</p>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@example.com" autocomplete="email" maxlength="120">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="login-pass" placeholder="••••••••" autocomplete="current-password" maxlength="128">
      </div>
      <a class="forgot-link" onclick="showForgot()">Forgot password?</a>
      <div id="login-error" class="form-error"></div>
      <button class="btn btn-primary w-full mt-1" id="login-btn" onclick="doLogin()">
        <span class="material-icons-round" style="font-size:16px;vertical-align:middle">login</span> Sign In
      </button>
      <p class="text-center mt-3" style="font-size:13px;color:var(--text-soft)">
        Don't have an account? <a href="/register.html" style="color:var(--primary)">Register free →</a>
      </p>
    </div>

    <!-- Forgot password form -->
    <div id="step-forgot" style="display:none">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your registered email address</p>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="forgot-email" placeholder="you@example.com" autocomplete="email" maxlength="120">
      </div>
      <div id="forgot-error" class="form-error"></div>
      <div id="forgot-success" style="display:none;color:#4caf50;font-size:13px;margin-bottom:12px"></div>
      <button class="btn btn-primary w-full" id="forgot-btn" onclick="doForgot()">
        <span class="material-icons-round" style="font-size:16px;vertical-align:middle">send</span> Send Reset Link
      </button>
      <p class="text-center mt-3" style="font-size:13px">
        <a onclick="showLogin()" style="color:var(--text-soft);cursor:pointer">← Back to login</a>
      </p>
    </div>
  </div>
</div>
</main>

<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
// Redirect if already logged in
(async () => {
  try {
    const r = await fetch('/api/auth/me');
    if (r.ok) { location.href = '/dashboard.html'; }
  } catch {}
})();

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError(id) {
  const el = document.getElementById(id);
  el.textContent = '';
  el.style.display = 'none';
}

function showForgot() {
  document.getElementById('step-login').style.display = 'none';
  document.getElementById('step-forgot').style.display = 'block';
  document.getElementById('forgot-email').focus();
}
function showLogin() {
  document.getElementById('step-forgot').style.display = 'none';
  document.getElementById('step-login').style.display = 'block';
}

async function doLogin() {
  clearError('login-error');
  const email    = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-pass').value;

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('login-error', 'Please enter a valid email address.');
  if (!password) return showError('login-error', 'Please enter your password.');

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!data.success) {
      showError('login-error', data.message || 'Invalid email or password. Please try again.');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons-round" style="font-size:16px;vertical-align:middle">login</span> Sign In';
      return;
    }
    if (data.data?.user) setUser(data.data.user);
    const redirectTo = new URLSearchParams(location.search).get('redirect') || '/dashboard.html';
    location.href = redirectTo;
  } catch {
    showError('login-error', 'Network error — please check your connection and try again.');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round" style="font-size:16px;vertical-align:middle">login</span> Sign In';
  }
}

async function doForgot() {
  clearError('forgot-error');
  document.getElementById('forgot-success').style.display = 'none';
  const email = document.getElementById('forgot-email').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('forgot-error', 'Please enter a valid email address.');

  const btn = document.getElementById('forgot-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();
    if (!data.success) {
      showError('forgot-error', data.message || 'Could not send reset link. Please try again.');
    } else {
      document.getElementById('forgot-success').textContent = data.message || 'Reset link sent! Check your email.';
      document.getElementById('forgot-success').style.display = 'block';
    }
  } catch {
    showError('forgot-error', 'Network error — please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round" style="font-size:16px;vertical-align:middle">send</span> Send Reset Link';
  }
}

// Allow Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('step-forgot').style.display !== 'none') doForgot();
  else doLogin();
});
</script>
</body>
</html>
