<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Prediction | Predictvilla</title>
<meta name="description" content="Expert football match prediction with AI-powered analysis, confidence score, H2H data and VIP tips on Predictvilla.">
<meta property="og:title" content="Football Prediction | Predictvilla">
<meta property="og:description" content="Expert football prediction with AI analysis, confidence score and H2H data.">
<meta property="og:image" content="https://predictvilla.com/images/logo.webp">
<meta property="og:url" content="https://predictvilla.com/predictions.html">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Football Prediction | Predictvilla">
<meta name="twitter:description" content="Expert AI-powered football prediction with confidence score, H2H data and tips.">
<meta name="twitter:image" content="https://predictvilla.com/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml"><link rel="icon" href="/images/logo.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a0d000">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<main>
  <section>
    <div class="container" style="max-width:800px">
      <div id="breadcrumb" class="mb-2" style="font-size:13px;color:var(--text-soft)">
        <a href="/">Home</a> › <a href="/predictions.html">Predictions</a> › <span id="bc-title">Loading…</span>
      </div>

      <div id="detail-content">
        <div class="skeleton" style="height:400px;border-radius:14px"></div>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script src="/js/app.js"></script>
<script>
const slug = window.location.pathname.match(/\/prediction\/([^/?#]+)/)?.[1];

document.addEventListener('DOMContentLoaded', async () => {
  if (!slug) { document.getElementById('detail-content').innerHTML = '<div class="empty-state"><h3>Prediction not found</h3></div>'; return; }

  try {
    const [predR, user] = await Promise.all([
      fetch(`/api/predictions/${slug}`),
      fetch('/api/auth/me').then(r => r.ok ? r.json().then(d => d.data?.user) : null)
    ]);
    if (!predR.ok) throw new Error('Not found');
    const { prediction: p } = (await predR.json()).data;

    const matchTitle = `${p.home_team} vs ${p.away_team} Prediction`;
    const matchDesc = `${p.tip} at odds ${p.odds ? parseFloat(p.odds).toFixed(2) : 'N/A'}. ${p.confidence_score ? 'Confidence: '+p.confidence_score+'%. ' : ''}Expert football prediction for ${p.league_name || 'football'} on Predictvilla.`;
    const fullTitle = `${p.home_team} vs ${p.away_team} Prediction — ${p.league_name || 'Football'} | Predictvilla`;
    setPageMeta({ title: `${p.home_team} vs ${p.away_team} Prediction — ${p.league_name || 'Football'}`, description: matchDesc, type: 'article' });
    // SportsEvent schema
    injectJsonLd({ "@context":"https://schema.org","@type":"SportsEvent","name":`${p.home_team} vs ${p.away_team}`,"startDate":p.match_date,"sport":"Football","homeTeam":{"@type":"SportsTeam","name":p.home_team},"awayTeam":{"@type":"SportsTeam","name":p.away_team},"location":{"@type":"Place","name":p.league_name||'Football'},"url":window.location.href,"description":matchDesc });
    // Article schema
    const artEl = document.createElement('script'); artEl.type='application/ld+json';
    artEl.textContent = JSON.stringify({"@context":"https://schema.org","@type":"Article","headline":fullTitle,"description":matchDesc,"url":window.location.href,"datePublished":p.match_date,"dateModified":p.updated_at||p.match_date,"author":{"@type":"Organization","name":"Predictvilla"},"publisher":{"@type":"Organization","name":"Predictvilla","logo":{"@type":"ImageObject","url":"https://predictvilla.com/images/logo.png"}}});
    document.head.appendChild(artEl);
    // BreadcrumbList
    const bcEl = document.createElement('script'); bcEl.type='application/ld+json';
    bcEl.textContent = JSON.stringify({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://predictvilla.com"},{"@type":"ListItem","position":2,"name":"Predictions","item":"https://predictvilla.com/predictions.html"},{"@type":"ListItem","position":3,"name":`${p.home_team} vs ${p.away_team}`,"item":window.location.href}]});
    document.head.appendChild(bcEl);
    document.getElementById('bc-title').textContent = `${p.home_team} vs ${p.away_team}`;

    const isVip = user?.role === 'vip' || user?.role === 'admin';
    const bookies = (() => { try { return JSON.parse(p.bookies_available || '[]'); } catch { return []; } })();

    const resultBadge = p.result !== 'pending' ? `<span class="badge badge-${p.result}" style="font-size:14px">${p.result.toUpperCase()}</span>` : '<span class="badge badge-pending">Pending</span>';

    document.getElementById('detail-content').innerHTML = `
      <h1 style="font-size:clamp(20px,3vw,30px);font-weight:900;margin-bottom:16px;line-height:1.3">${escapeHtml(p.home_team)} vs ${escapeHtml(p.away_team)} — ${escapeHtml(p.league_name||'Football')} Prediction</h1>
      <div class="card">
        ${p.is_banker ? '<div class="text-center mb-3"><span class="badge badge-banker" style="font-size:14px;padding:6px 18px"><span class="material-icons-round" style="font-size:14px;vertical-align:middle">star</span> BANKER OF THE DAY</span></div>' : ''}
        ${p.is_vip && !p.is_banker ? '<div class="text-right mb-2"><span class="badge badge-vip">VIP Pick</span></div>' : ''}

        <div class="flex-between mb-3" style="flex-wrap:wrap;gap:10px">
          <div class="league-tag">
            ${p.league_logo ? `<img src="${escapeHtml(p.league_logo)}" style="width:20px;height:20px;object-fit:contain">` : '<span class="material-icons-round" style="font-size:20px">emoji_events</span>'}
            <strong>${escapeHtml(p.league_name || 'Football')}</strong>
          </div>
          <div class="flex gap-2 align-center">
            ${resultBadge}
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--text-soft)">${new Date(p.match_date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
              <div style="font-size:14px;font-weight:700;color:var(--primary)">KO: ${new Date(p.match_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          </div>
        </div>

        <div class="teams-row" style="margin:24px 0">
          <div class="team">
            ${p.home_team_logo ? `<img src="${escapeHtml(p.home_team_logo)}" style="width:60px;height:60px;object-fit:contain">` : '<span class="material-icons-round" style="font-size:48px">sports_soccer</span>'}
            <div class="team-name" style="font-size:16px;font-weight:700">${escapeHtml(p.home_team)}</div>
            ${p.home_form ? `<div class="form-string">${renderForm(p.home_form)}</div>` : ''}
          </div>
          <div style="text-align:center">
            ${p.home_score !== null && p.away_score !== null ? `<div style="font-size:32px;font-weight:900;color:var(--primary)">${p.home_score} - ${p.away_score}</div>` : '<div class="vs-divider" style="font-size:20px">VS</div>'}
          </div>
          <div class="team">
            ${p.away_team_logo ? `<img src="${escapeHtml(p.away_team_logo)}" style="width:60px;height:60px;object-fit:contain">` : '<span class="material-icons-round" style="font-size:48px">sports_soccer</span>'}
            <div class="team-name" style="font-size:16px;font-weight:700">${escapeHtml(p.away_team)}</div>
            ${p.away_form ? `<div class="form-string">${renderForm(p.away_form)}</div>` : ''}
          </div>
        </div>

        ${!p.is_vip || isVip ? `
        <div class="prediction-tip" style="padding:16px 20px;margin:16px 0">
          <div><div class="tip-label" style="font-size:13px;margin-bottom:4px">Our Prediction</div>
          <div class="tip-value" style="font-size:20px">${escapeHtml(p.tip)}</div></div>
          ${p.odds ? `<div style="text-align:right"><div class="tip-label" style="font-size:13px;margin-bottom:4px">Odds</div><div class="odds-value" style="font-size:22px">${formatOdds(p.odds)}</div></div>` : ''}
        </div>` : `<div class="alert alert-warning"><span class="material-icons-round" style="font-size:16px;vertical-align:middle">lock</span> This is a VIP pick. <a href="/pricing.html">Subscribe to unlock →</a></div>`}

        <div class="grid-2" style="gap:16px;margin:20px 0">
          <div>${p.confidence_score ? buildConfidenceBar(p.confidence_score) : ''}</div>
          <div style="display:flex;justify-content:flex-end">${p.intelligence_score && isVip ? buildIntelligenceGauge(p.intelligence_score) : ''}</div>
        </div>

        ${p.market ? `<p class="text-soft" style="font-size:13px">Market: <strong style="color:var(--text)">${escapeHtml(p.market)}</strong></p>` : ''}

        <!-- Community Votes -->
        <div class="card mt-3" style="background:var(--bg-2)">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:10px"><span class="material-icons-round" style="font-size:16px;vertical-align:middle">how_to_vote</span> Community Pick</h3>
          <div id="vote-section">Loading votes…</div>
        </div>

        ${bookies.length ? `
        <!-- Bookmaker links -->
        <div class="card mt-3" style="background:var(--bg-2)">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:10px"><span class="material-icons-round" style="font-size:16px;vertical-align:middle">casino</span> Bet on This Match</h3>
          <div class="aff-odds-grid">${bookies.slice(0,6).map(b => {
            const links = {'Bet9ja':'https://bet9ja.com','Sportybet':'https://sportybet.com','1xBet':'https://1xbet.com','BetWay':'https://betway.com','Betano':'https://betano.com'};
            const link = links[b] || '#';
            return `<a href="${escapeHtml(link)}" target="_blank" rel="nofollow noopener" class="aff-odds-card"><div class="aff-odds-bookie">${escapeHtml(b)}</div><div class="aff-odds-val">Bet Now →</div></a>`;
          }).join('')}</div>
        </div>` : ''}

        ${p.analysis && (!p.is_vip || isVip) ? `
        <div class="card mt-3" style="background:var(--bg-2)">
          <h3 style="font-size:16px;margin-bottom:12px;color:var(--primary)"><span class="material-icons-round">analytics</span> Analysis</h3>
          <p style="color:var(--text-soft);font-size:14px;line-height:1.8;white-space:pre-wrap">${escapeHtml(p.analysis)}</p>
        </div>` : ''}

        <!-- Market Probabilities (loaded async) -->
        <div id="prob-section"></div>

        <!-- H2H (loaded async) -->
        <div id="h2h-section"></div>

        <div class="flex gap-2 mt-3" style="flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="toggleBookmark('${p.id}')"><span class="material-icons-round">bookmark_add</span> Bookmark</button>
          <button class="btn btn-ghost btn-sm" onclick="shareThis()"><span class="material-icons-round">share</span> Share</button>
          <a href="/predictions.html" class="btn btn-ghost btn-sm">← Back</a>
        </div>
      </div>

      ${p.seo_body ? `
      <!-- SEO Article Body -->
      <div class="card mt-3" style="background:var(--bg-2)">
        <div class="article-content" style="font-size:15px;line-height:1.85;color:var(--text)">${p.seo_body}</div>
      </div>` : ''}

      <!-- Comments -->
      <div class="card mt-3">
        <h3 style="font-size:18px;margin-bottom:16px"><span class="material-icons-round">comment</span> Comments</h3>
        <div id="comments-list"></div>
        <div id="comment-form" class="mt-3" style="display:none">
          <textarea class="form-control" id="comment-input" rows="3" placeholder="Share your thoughts…" style="resize:vertical"></textarea>
          <button class="btn btn-primary btn-sm mt-2" onclick="postComment(${p.id})">Post Comment</button>
        </div>
        <div id="comment-login-prompt" class="mt-2 text-soft" style="font-size:13px;display:none">
          <a href="/pricing.html#login">Login</a> to leave a comment.
        </div>
      </div>`;

    loadComments(p.id);
    loadProbabilities(p.id);
    loadH2H(p.id);
    loadVotes(p.id);
    if (user) document.getElementById('comment-form').style.display = 'block';
    else document.getElementById('comment-login-prompt').style.display = 'block';
  } catch (err) {
    document.getElementById('detail-content').innerHTML = '<div class="empty-state"><div class="empty-icon"><span class="material-icons-round" style="font-size:48px">sports_soccer</span></div><h3>Prediction not found</h3><a href="/predictions.html" class="btn btn-outline mt-2">← Back to predictions</a></div>';
  }
});

async function loadProbabilities(predId) {
  const el = document.getElementById('prob-section');
  try {
    const r = await fetch(`/api/predictions/id/${predId}/probabilities`);
    if (!r.ok) return;
    const { data: d } = await r.json();
    if (!d) return;

    const bar = (pct, color) =>
      `<div style="background:rgba(255,255,255,0.07);border-radius:6px;height:8px;overflow:hidden;flex:1">
         <div style="width:${pct}%;height:100%;background:${color};border-radius:6px;transition:width .4s"></div>
       </div>`;

    const row = (label, pct, color = 'var(--primary)') =>
      `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
         <span style="width:120px;font-size:12px;color:var(--text-soft);flex-shrink:0">${label}</span>
         ${bar(pct, color)}
         <span style="width:36px;text-align:right;font-size:13px;font-weight:700;color:var(--text)">${pct}%</span>
       </div>`;

    const section = (title, items, colorFn) =>
      `<div style="margin-bottom:20px">
         <h4 style="font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-soft);margin-bottom:10px">${title}</h4>
         ${items.map(i => row(i.label, i.pct, colorFn ? colorFn(i) : 'var(--primary)')).join('')}
       </div>`;

    const m = d.markets;
    const scoreColor = i => i.pct >= 20 ? 'var(--primary)' : i.pct >= 12 ? 'var(--accent)' : 'rgba(173,223,241,0.3)';

    el.innerHTML = `
      <div class="card mt-3" style="background:var(--bg-2)">
        <h3 style="font-size:16px;margin-bottom:6px;color:var(--primary)">
          <span class="material-icons-round">insights</span> Market Probabilities
        </h3>
        <p style="font-size:12px;color:var(--text-soft);margin-bottom:18px">
          Poisson model — λ home ${d.lambdas.home} / λ away ${d.lambdas.away}
          ${d.expectedCorners ? `· Expected corners: ${d.expectedCorners}` : ''}
        </p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 32px">
          <div>
            ${section('1X2', m['1X2'], i => i.label==='Home Win'?'var(--primary)':i.label==='Draw'?'var(--warning)':'var(--accent)')}
            ${section('Both Teams to Score', m['BTTS'], i => i.label==='BTTS Yes'?'var(--primary)':'rgba(255,80,80,0.7)')}
            ${section('Draw No Bet', m['Draw No Bet'])}
          </div>
          <div>
            ${section('Over / Under Goals', m['Over/Under'], i => i.label.startsWith('Over')?'var(--primary)':'rgba(255,80,80,0.7)')}
            ${section('Double Chance', m['Double Chance'])}
          </div>
        </div>

        <div style="margin-top:4px">
          <h4 style="font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-soft);margin-bottom:10px">Top Scorelines</h4>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${d.topScorelines.map(s =>
              `<div style="background:var(--bg-3,rgba(255,255,255,0.06));border-radius:8px;padding:6px 12px;text-align:center;min-width:60px">
                 <div style="font-size:15px;font-weight:800;color:var(--text)">${s.score}</div>
                 <div style="font-size:11px;color:var(--text-soft)">${s.pct}%</div>
               </div>`
            ).join('')}
          </div>
        </div>
      </div>`;
  } catch {}
}

async function loadH2H(predId) {
  const el = document.getElementById('h2h-section');
  try {
    const r = await fetch(`/api/predictions/id/${predId}/h2h`);
    if (!r.ok) return;
    const { data: d } = await r.json();
    if (!d || !d.matches.length) return;

    const s = d.summary;
    const total = s.total || 1;
    const resultColor = res => res === 'H' ? 'var(--primary)' : res === 'A' ? 'var(--accent)' : 'var(--warning)';
    const resultLabel = (res, ht, at) => res === 'H' ? ht : res === 'A' ? at : 'Draw';

    el.innerHTML = `
      <div class="card mt-3" style="background:var(--bg-2)">
        <h3 style="font-size:16px;margin-bottom:14px">
          <span class="material-icons-round">compare_arrows</span> Head to Head
        </h3>

        <!-- Summary bar -->
        <div style="display:flex;align-items:center;gap:0;border-radius:8px;overflow:hidden;height:28px;margin-bottom:14px">
          <div style="flex:${s.homeWins};background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0d1600;min-width:${s.homeWins?'28px':'0'}">${s.homeWins||''}</div>
          <div style="flex:${s.draws};background:var(--warning);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0d1600;min-width:${s.draws?'28px':'0'}">${s.draws||''}</div>
          <div style="flex:${s.awayWins};background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0d1600;min-width:${s.awayWins?'28px':'0'}">${s.awayWins||''}</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-bottom:16px">
          <span><strong style="color:var(--primary)">${s.homeWins}W</strong> ${escapeHtml(d.homeTeam)}</span>
          <span style="color:var(--warning)">${s.draws} Draw${s.draws!==1?'s':''}</span>
          <span><strong style="color:var(--accent)">${s.awayWins}W</strong> ${escapeHtml(d.awayTeam)}</span>
        </div>

        <!-- Match-by-match -->
        <div style="display:flex;flex-direction:column;gap:6px">
          ${d.matches.map(m => `
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-3,rgba(255,255,255,0.04));border-radius:8px;font-size:13px">
              <span style="color:var(--text-soft);width:82px;flex-shrink:0;font-size:12px">${m.date}</span>
              <span style="flex:1;text-align:right;color:var(--text)">${escapeHtml(d.homeTeam)}</span>
              <span style="padding:2px 10px;border-radius:6px;background:${resultColor(m.result)};color:#0d1600;font-weight:800;font-size:14px;min-width:42px;text-align:center">${m.homeScore} - ${m.awayScore}</span>
              <span style="flex:1;color:var(--text)">${escapeHtml(d.awayTeam)}</span>
              <span style="font-size:11px;color:${resultColor(m.result)};font-weight:700;width:60px;flex-shrink:0;text-align:right">${resultLabel(m.result,d.homeTeam,d.awayTeam).split(' ')[0]}</span>
            </div>`).join('')}
        </div>
      </div>`;
  } catch {}
}

async function loadVotes(predId) {
  const el = document.getElementById('vote-section');
  if (!el) return;
  try {
    const stored = JSON.parse(localStorage.getItem('pv_votes') || '{}');
    const userVote = stored[predId] || null;
    const r = await fetch(`/api/predictions/${predId}/votes`);
    if (!r.ok) { el.innerHTML = ''; return; }
    const d = await r.json();
    el.innerHTML = buildVoteBar(d.data?.votes || {home:0,draw:0,away:0}, predId, userVote);
  } catch { if (el) el.innerHTML = ''; }
}

function renderForm(form) {
  if (!form) return '';
  const dots = form.split('').map(r => {
    const bg = r==='W' ? 'var(--primary)' : r==='L' ? 'var(--danger)' : 'var(--warning)';
    const fg = r==='L' ? '#fff' : '#0d1600';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:${bg};color:${fg};font-size:11px;font-weight:800;margin:0 2px">${r}</span>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
    ${dots}
    <span style="font-size:11px;color:var(--text-soft);margin-left:4px">${form} (last ${form.length})</span>
  </div>`;
}

async function loadComments(predId) {
  const el = document.getElementById('comments-list');
  try {
    const r = await fetch(`/api/comments/${predId}`);
    const data = await r.json();
    const comments = data.data?.comments || [];
    if (!comments.length) { el.innerHTML = '<p class="text-soft" style="font-size:14px">No comments yet. Be the first!</p>'; return; }
    el.innerHTML = comments.map(c => `
      <div style="border-bottom:1px solid var(--border);padding:12px 0">
        <div class="flex-between"><strong style="font-size:14px">${escapeHtml(c.user_name)}</strong><span class="text-muted" style="font-size:12px">${timeAgo(c.created_at)}</span></div>
        <p style="font-size:14px;color:var(--text-soft);margin-top:4px">${escapeHtml(c.content)}</p>
      </div>`).join('');
  } catch { el.innerHTML = '<p class="text-soft">Failed to load comments.</p>'; }
}

async function postComment(predId) {
  const input = document.getElementById('comment-input');
  const btn = document.querySelector('#comment-form button');
  const content = input.value.trim();
  if (!content) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Posting…'; }
  try {
    const r = await fetch(`/api/comments/${predId}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ content }) });
    if (r.status === 401) { showToast('Please log in to post a comment', 'error'); return; }
    const data = await r.json();
    if (data.success) { input.value = ''; showToast('Comment posted!', 'success'); loadComments(predId); }
    else showToast(data.message || 'Failed to post comment', 'error');
  } catch (e) {
    showToast('Network error — please try again', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Post Comment'; }
  }
}

async function toggleBookmark(predId) {
  const r = await fetch(`/api/users/bookmarks/${predId}`, { method: 'POST' });
  if (r.status === 401) { showToast('Login to bookmark', 'info'); return; }
  const data = await r.json();
  showToast(data.message, data.success ? 'success' : 'info');
}

function shareThis() {
  if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }); }
  else { navigator.clipboard?.writeText(window.location.href); showToast('Link copied!', 'success'); }
}
</script>
</body>
</html>
